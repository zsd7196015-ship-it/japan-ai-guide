<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 随身导游 - 20米精准触发</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-secondary: #7f8c8d;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .top-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h2.app-title {
            font-size: 1.15rem;
            margin: 0;
            color: var(--primary-color);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 12px 14px;
            font-size: 0.95rem;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #219653;
        }

        #status {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 10px;
            text-align: center;
        }

        .spot-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spot-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 4px solid #cbd5e1;
            transition: all 0.3s ease;
        }

        /* 核心：进入 20 米以内的激活状态样式 */
        .spot-card.in-range {
            border-left: 4px solid #e74c3c;
            background: #fffdfd;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.15);
        }

        .spot-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: var(--primary-color);
        }

        .spot-meta {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .spot-desc-section {
            font-size: 0.9rem;
            color: #4b6584;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .trigger-notice {
            font-size: 0.85rem;
            color: #c0392b;
            background: #fde8e8;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-weight: bold;
            display: none;
        }

        .spot-card.in-range .trigger-notice {
            display: block;
        }

        .spot-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            border: 1px solid #dcdde1;
            background: #fff;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .action-btn.map {
            background-color: #2980b9;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-card">
            <header>
                <h2 class="app-title">🧭 随身导游 (20米自动触发)</h2>
            </header>

            <div class="controls">
                <button onclick="startTracking()">📍 开启实时定位与自动讲解</button>
            </div>

            <div id="status">点击上方按钮，开始边走边听...</div>
        </div>

        <div class="spot-list" id="spots-container">
            <div style="text-align:center; padding: 30px; color: #7f8c8d; background: white; border-radius: 12px;">
                暂无周边景点数据，请先点击开启定位
            </div>
        </div>
    </div>

    <script>
        let watchId = null;
        let allSpots = [];
        let lastTriggeredId = null; // 防止在同一个景点范围内重复触发语音

        function startTracking() {
            const statusEl = document.getElementById('status');
            
            if (!navigator.geolocation) {
                statusEl.innerText = "您的浏览器不支持地理定位";
                return;
            }

            statusEl.innerText = "正在获取周边景点并实时追踪位置...";

            // 先获取一次坐标拉取周边景点
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    fetchSpots(position.coords.latitude, position.coords.longitude);
                    
                    // 开启持续监听 (watchPosition) 实现“走到哪讲到哪”
                    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                    watchId = navigator.geolocation.watchPosition(
                        (pos) => {
                            updateUserLocation(pos.coords.latitude, pos.coords.longitude);
                        },
                        (err) => { statusEl.innerText = "定位更新失败: " + err.message; },
                        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                    );
                },
                (err) => { statusEl.innerText = "无法获取定位权限: " + err.message; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function fetchSpots(lat, lon) {
            const statusEl = document.getElementById('status');
            
            // 查询周边的历史古迹、神社、公园、地标
            const query = `
                [out:json][timeout:25];
                (
                  node(around:1500,${lat},${lon})[historic];
                  way(around:1500,${lat},${lon})[historic];
                  node(around:1500,${lat},${lon})[tourism];
                  way(around:1500,${lat},${lon})[tourism];
                  node(around:1500,${lat},${lon})[leisure=park];
                  way(around:1500,${lat},${lon})[leisure=park];
                  node(around:1500,${lat},${lon})[amenity=place_of_worship];
                  way(around:1500,${lat},${lon})[amenity=place_of_worship];
                );
                out center;
            `;

            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query
                });
                const data = await response.json();
                
                allSpots = data.elements.filter(item => {
                    const tags = item.tags || {};
                    const name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'] || '';
                    if (!name) return false;
                    
                    // 过滤无关民宅、公寓等
                    const blacklist = ['团地', '団地', 'アパート', 'マンション', 'ハイツ', '住宅', 'apartments'];
                    for (let word of blacklist) {
                        if (name.toLowerCase().includes(word.toLowerCase())) return false;
                    }
                    return true;
                });

                statusEl.innerText = `已加载周边 ${allSpots.length} 个地点，正在实时监控距离...`;
                updateUserLocation(lat, lon);
            } catch (err) {
                statusEl.innerText = "获取周边景点数据失败";
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function updateUserLocation(lat, lon) {
            if (allSpots.length === 0) return;

            // 计算每个景点与当前坐标的距离，并排序
            allSpots.forEach(spot => {
                const spotLat = spot.lat || (spot.center && spot.center.lat);
                const spotLon = spot.lon || (spot.center && spot.center.lon);
                spot.distance = (spotLat && spotLon) ? calculateDistance(lat, lon, spotLat, spotLon) : 99999;
            });

            allSpots.sort((a, b) => a.distance - b.distance);
            renderSpotsList();

            // 检查是否有任何景点进入 20 米范围内
            const nearestSpot = allSpots[0];
            if (nearestSpot && nearestSpot.distance <= 20) {
                const spotId = nearestSpot.id;
                if (lastTriggeredId !== spotId) {
                    lastTriggeredId = spotId; // 锁定，避免反复触发
                    const tags = nearestSpot.tags || {};
                    const name = tags.name || tags['name:ja'] || tags['name:zh'] || '附近景点';
                    triggerAudioAndAlert(name);
                }
            } else {
                // 如果走出了 20 米范围，重置触发锁
                if (nearestSpot && nearestSpot.distance > 25) {
                    lastTriggeredId = null;
                }
            }
        }

        function triggerAudioAndAlert(spotName) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            const text = `您已进入 ${spotName} 附近 20 米范围内。为您开始讲解。`;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP'; // 可根据需要改成 zh-CN 或自动识别
            window.speechSynthesis.speak(utterance);
        }

        function renderSpotsList() {
            const container = document.getElementById('spots-container');
            container.innerHTML = '';

            allSpots.forEach(spot => {
                const tags = spot.tags || {};
                const name = tags.name || tags['name:ja'] || tags['name:zh'] || '历史古迹';
                const spotLat = spot.lat || (spot.center && spot.center.lat);
                const spotLon = spot.lon || (spot.center && spot.center.lon);
                const mapUrl = (spotLat && spotLon) ? `https://www.google.com/maps/search/?api=1&query=${spotLat},${spotLon}` : '#';
                
                const isWithin20M = spot.distance <= 20;

                const card = document.createElement('div');
                card.className = isWithin20M ? 'spot-card in-range' : 'spot-card';

                card.innerHTML = `
                    <div class="spot-title">${name}</div>
                    <div class="spot-meta">距离您：约 ${spot.distance} 米</div>
                    <div class="spot-desc-section">
                        ${tags.historic ? '🏛️ 历史古迹 / 遗址' : tags.amenity === 'place_of_worship' ? '⛩️ 神社寺庙' : '🌳 公园与地标'}
                    </div>
                    <div class="trigger-notice">📍 已进入 20 米范围内，触发自动讲解！</div>
                    <div class="spot-actions">
                        <a class="action-btn map" href="${mapUrl}" target="_blank">🗺️ 导航查看</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 页面离开时清理监听
        window.addEventListener('beforeunload', () => {
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        });
    </script>
</body>
</html>
