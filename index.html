<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 多语言随身导游</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-secondary: #7f8c8d;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .top-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.15rem;
            margin: 0;
            color: var(--primary-color);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button, select {
            padding: 10px 14px;
            font-size: 0.9rem;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            outline: none;
        }

        button.primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            font-weight: 600;
        }

        button.primary:hover {
            background-color: #219653;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .category-tab {
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 20px;
            border: 1px solid #dcdde1;
            background: #fff;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
        }

        .category-tab.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            font-weight: 600;
        }

        #status {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 10px;
            text-align: center;
        }

        .spot-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spot-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 4px solid var(--accent-color);
        }

        .spot-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--primary-color);
        }

        .spot-meta {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .spot-desc {
            font-size: 0.9rem;
            color: #4b6584;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .spot-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            border: 1px solid #dcdde1;
            background: #fff;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .action-btn.audio {
            background-color: var(--accent-color);
            color: white;
            border: none;
        }

        .action-btn.map {
            background-color: #2980b9;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-card">
            <header>
                <h1 id="ui-title">🧭 AI 随身导游</h1>
                <!-- 三种语言切换选择框 -->
                <select id="lang-select" onchange="changeLanguage()">
                    <option value="zh">中文 (简体)</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                </select>
            </header>

            <div class="controls">
                <button class="primary" id="btn-gps" onclick="getLocationAndExplore()">📍 获取实时GPS并探索周边景点</button>
                
                <div class="category-tabs">
                    <button class="category-tab active" data-category="all" onclick="setCategory('all', this)">热门景点</button>
                    <button class="category-tab" data-category="historic" onclick="setCategory('historic', this)">历史古迹与神社</button>
                    <button class="category-tab" data-category="park" onclick="setCategory('park', this)">公园与绿地</button>
                    <button class="category-tab" data-category="museum" onclick="setCategory('museum', this)">博物馆与乡土馆</button>
                </div>
            </div>

            <div id="status">请点击上方按钮获取位置并加载周边景点...</div>
        </div>

        <div class="spot-list" id="spots-container"></div>
    </div>

    <script>
        let currentLat = null;
        let currentLon = null;
        let allSpots = [];
        let currentCategory = 'all';
        let currentLang = 'zh';

        // 三种独立语言的文本配置与语音库映射
        const i18n = {
            zh: {
                title: "🧭 AI 随身导游",
                gpsBtn: "📍 获取实时GPS并探索周边景点",
                statusInit: "请点击上方按钮获取位置并加载周边景点...",
                statusLocating: "正在获取您的 GPS 位置...",
                statusLoading: "正在查询周边优质景点...",
                statusSuccess: "周边景点与语音解说已就绪！",
                statusErrorGPS: "无法获取您的地理位置，请确保浏览器已授权定位。",
                statusErrorFetch: "获取景点数据失败，请稍后重试。",
                noSpots: "该分类下暂无符合条件的景点。",
                cats: { all: "热门景点", historic: "历史古迹与神社", park: "公园与绿地", museum: "博物馆与乡土馆" },
                distancePrefix: "距离您：约",
                distanceWalk: "距离您：步行可达范围内",
                descSuffix: "是当地极具代表性的重要人文地标，承载着丰富的历史文化与区域特色。",
                audioBtn: "🎤 语音讲解",
                mapBtn: "🗺️ 导航",
                speechLang: "zh-CN"
            },
            en: {
                title: "🧭 AI Tour Guide",
                gpsBtn: "📍 Get GPS & Explore Nearby",
                statusInit: "Click the button above to get location and load nearby spots...",
                statusLocating: "Getting your GPS location...",
                statusLoading: "Searching for nearby spots...",
                statusSuccess: "Nearby spots and audio guides ready!",
                statusErrorGPS: "Unable to get location. Please enable location permissions.",
                statusErrorFetch: "Failed to fetch spots. Please try again later.",
                noSpots: "No spots found in this category.",
                cats: { all: "Hot Spots", historic: "History & Shrines", park: "Parks & Greenery", museum: "Museums" },
                distancePrefix: "Distance: approx.",
                distanceWalk: "Distance: within walking distance",
                descSuffix: "is an important local landmark rich in cultural character and historical heritage.",
                audioBtn: "🎤 Audio Guide",
                mapBtn: "🗺️ Map",
                speechLang: "en-US"
            },
            ja: {
                title: "🧭 AI ガイド",
                gpsBtn: "📍 GPS取得して周辺を探索",
                statusInit: "上のボタンを押して位置情報を取得し、周辺スポットを読み込んでください...",
                statusLocating: "GPS位置情報を取得中...",
                statusLoading: "周辺のスポットを検索中...",
                statusSuccess: "周辺のスポットと音声解説の準備ができました！",
                statusErrorGPS: "位置情報を取得できません。位置情報の権限を確認してください。",
                statusErrorFetch: "スポットデータの取得に失敗しました。後ほど再試行してください。",
                noSpots: "このカテゴリに該当するスポットはありません。",
                cats: { all: "人気スポット", historic: "歴史・神社", park: "公園・緑地", museum: "博物館" },
                distancePrefix: "距離：約",
                distanceWalk: "距離：徒歩圏内",
                descSuffix: "はこの地域の歴史と文化を伝える重要な地域ランドマークです。",
                audioBtn: "🎤 音声解説",
                mapBtn: "🗺️ マップ",
                speechLang: "ja-JP"
            }
        };

        function changeLanguage() {
            currentLang = document.getElementById('lang-select').value;
            const t = i18n[currentLang];
            
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('btn-gps').innerText = t.gpsBtn;
            document.getElementById('status').innerText = t.statusInit;

            const tabs = document.querySelectorAll('.category-tab');
            tabs.forEach(tab => {
                const catKey = tab.getAttribute('data-category');
                tab.innerText = t.cats[catKey];
            });

            if (allSpots.length > 0) {
                renderSpots();
            }
        }

        function setCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            renderSpots();
        }

        function getLocationAndExplore() {
            const t = i18n[currentLang];
            const statusEl = document.getElementById('status');
            
            if (!navigator.geolocation) {
                statusEl.innerText = "Geolocation is not supported";
                return;
            }

            statusEl.innerText = t.statusLocating;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    fetchSpots(currentLat, currentLon);
                },
                (error) => {
                    statusEl.innerText = t.statusErrorGPS;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function fetchSpots(lat, lon) {
            const t = i18n[currentLang];
            const statusEl = document.getElementById('status');
            statusEl.innerText = t.statusLoading;

            const query = `
                [out:json][timeout:25];
                (
                  node(around:1500,${lat},${lon})[historic];
                  way(around:1500,${lat},${lon})[historic];
                  node(around:1500,${lat},${lon})[tourism];
                  way(around:1500,${lat},${lon})[tourism];
                  node(around:1500,${lat},${lon})[leisure=park];
                  way(around:1500,${lat},${lon})[leisure=park];
                );
                out center;
            `;

            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query
                });
                const data = await response.json();
                
                allSpots = data.elements.filter(item => {
                    const tags = item.tags || {};
                    const name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'];
                    if (!name) return false;
                    if (['school', 'university', 'hospital', 'parking', 'police'].includes(tags.amenity)) return false;
                    return true;
                });

                statusEl.innerText = t.statusSuccess;
                renderSpots();
            } catch (err) {
                statusEl.innerText = t.statusErrorFetch;
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        // 核心语音讲解功能：严格匹配当前选择的语种并调用浏览器免费语音播报
        function speakAudio(titleText, descText) {
            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音播报功能');
                return;
            }
            
            window.speechSynthesis.cancel(); // 停止当前正在播放的声音

            const t = i18n[currentLang];
            const textToSpeak = `${titleText}. ${descText}`;
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            
            utterance.lang = t.speechLang; // 对应切换成中文 zh-CN、英文 en-US 或日语 ja-JP
            utterance.rate = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        function renderSpots() {
            const container = document.getElementById('spots-container');
            container.innerHTML = '';
            const t = i18n[currentLang];

            let filteredSpots = allSpots.filter(spot => {
                const tags = spot.tags || {};
                let spotType = 'other';
                if (tags.leisure === 'park') spotType = 'park';
                else if (tags.historic) spotType = 'historic';
                else if (tags.tourism === 'museum') spotType = 'museum';

                if (currentCategory === 'all') return true;
                return spotType === currentCategory;
            });

            if (currentLat !== null && currentLon !== null) {
                filteredSpots.sort((a, b) => {
                    const latA = a.lat || (a.center && a.center.lat);
                    const lonA = a.lon || (a.center && a.center.lon);
                    const latB = b.lat || (b.center && b.center.lat);
                    const lonB = b.lon || (b.center && b.center.lon);

                    const distA = (latA && lonA) ? calculateDistance(currentLat, currentLon, latA, lonA) : 999999;
                    const distB = (latB && lonB) ? calculateDistance(currentLat, currentLon, latB, lonB) : 999999;
                    return distA - distB;
                });
            }

            if (filteredSpots.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-secondary);">${t.noSpots}</div>`;
                return;
            }

            filteredSpots.forEach(spot => {
                const tags = spot.tags || {};
                const name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'] || '未知地点';
                
                const spotLat = spot.lat || (spot.center && spot.center.lat);
                const spotLon = spot.lon || (spot.center && spot.center.lon);

                let distanceText = t.distanceWalk;
                if (currentLat !== null && currentLon !== null && spotLat && spotLon) {
                    const dist = calculateDistance(currentLat, currentLon, spotLat, spotLon);
                    if (dist > 0) {
                        distanceText = `${t.distancePrefix} ${dist} 米`;
                    }
                }

                const mapUrl = (spotLat && spotLon) ? `https://www.google.com/maps/search/?api=1&query=${spotLat},${spotLon}` : '#';
                const descText = `${name} ${t.descSuffix}`;

                const card = document.createElement('div');
                card.className = 'spot-card';
                card.innerHTML = `
                    <div class="spot-title">${name}</div>
                    <div class="spot-meta">${distanceText}</div>
                    <div class="spot-desc">${descText}</div>
                    <div class="spot-actions">
                        <button class="action-btn audio" onclick="speakAudio('${name.replace(/'/g, "\\'")}', '${descText.replace(/'/g, "\\'")}')">${t.audioBtn}</button>
                        <a class="action-btn map" href="${mapUrl}" target="_blank">${t.mapBtn}</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
