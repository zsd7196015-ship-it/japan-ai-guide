        function changeLanguage() {
            currentLang = document.getElementById('lang-select').value;
            const t = i18n[currentLang];
            
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('lang-label-text').innerText = t.langLabel;
            document.getElementById('btn-gps').innerText = t.gpsBtn;
            document.getElementById('status').innerText = t.statusInit;

            document.getElementById('opt-recommend').innerText = t.cats.recommend;
            document.getElementById('opt-historic').innerText = t.cats.historic;
            document.getElementById('opt-park').innerText = t.cats.park;
            document.getElementById('opt-museum').innerText = t.cats.museum;

            const welcomeTitleEl = document.getElementById('welcome-title');
            const welcomeDescEl = document.getElementById('welcome-desc');
            if (welcomeTitleEl) welcomeTitleEl.innerText = t.welcomeTitle;
            if (welcomeDescEl) welcomeDescEl.innerText = t.welcomeDesc;

            if (allSpots.length > 0) {
                renderSpots();
            }
        }

        function onCategoryChange() {
            currentCategory = document.getElementById('category-select').value;
            renderSpots();
        }

        function getLocationAndExplore() {
            const t = i18n[currentLang];
            const statusEl = document.getElementById('status');
            
            if (!navigator.geolocation) {
                statusEl.innerText = "Geolocation is not supported";
                return;
            }

            statusEl.innerText = t.statusLocating;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    fetchSpots(currentLat, currentLon);
                },
                (error) => {
                    statusEl.innerText = t.statusErrorGPS;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function fetchSpots(lat, lon) {
            const t = i18n[currentLang];
            const statusEl = document.getElementById('status');
            statusEl.innerText = t.statusLoading;

            const query = `
                [out:json][timeout:25];
                (
                  node(around:1000,${lat},${lon})[historic];
                  way(around:1000,${lat},${lon})[historic];
                  node(around:1000,${lat},${lon})[tourism];
                  way(around:1000,${lat},${lon})[tourism];
                  node(around:1000,${lat},${lon})[leisure=park];
                  way(around:1000,${lat},${lon})[leisure=park];
                  node(around:1000,${lat},${lon})[amenity=place_of_worship];
                  way(around:1000,${lat},${lon})[amenity=place_of_worship];
                );
                out center;
            `;

            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query
                });
                const data = await response.json();
                
                allSpots = data.elements.filter(item => {
                    const tags = item.tags || {};
                    const name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'] || '';
                    if (!name) return false;
                    const blacklist = ['团地', '団地', 'アパート', 'マンション', 'ハイツ', 'コーポ', '住宅', 'school', 'hospital', 'university', 'parking', 'police', 'apartments', 'supermarket'];
                    for (let word of blacklist) {
                        if (name.toLowerCase().includes(word.toLowerCase())) return false;
                    }
                    return true;
                });

                statusEl.innerText = t.statusSuccess;
                renderSpots();
            } catch (err) {
                statusEl.innerText = t.statusErrorFetch;
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function isLandmarkSpot(name, tags) {
            const keywords = ['浅草寺', '雷门', '上野恩赐公园', '东京晴空塔', '浅草神社', '西新井大师', '公园', '神社', '寺', '涩谷', '皇居'];
            for (let kw of keywords) {
                if (name.includes(kw)) return true;
            }
            return !!tags.tourism || !!tags.historic;
        }

                    };
                    subSpots = [
                        { title: "西郷隆盛像", basic: "上野のシンボルとして親しまれる銅像。", anecdote: "除幕式で妻が「うちの人はこんな人じゃなかった」と驚いた逸話が残っています。", photo: "緑に囲まれた厳かな雰囲気。" }
                    ];
                } else {
                    macro = {
                        overview: "日本第一座西式公园，前身是德川幕府家族菩提寺“宽永寺”的领地，汇聚多座国家级博物馆。",
                        hook: "当年刀光剑影的杀伐之地，如今已变成温柔的市井乐园。抬腿进园，咱们去找找那位“裤腿没扎好”的传奇人物！"
                    };
                    subSpots = [
                        { title: "✨ 西乡隆盛铜像（翻车名场面）", basic: "牵着大狗、身形魁梧的明治维新功臣铜像。", anecdote: "铜像揭幕时其妻当场惊呼‘这根本不是我丈夫’，因为雕像把其打猎时衣衫不整的随性姿态永久定格了。", photo: "铜像侧前方特写。" }
                    ];
                }
            } else {
                macro = {
                    overview: lang === 'en' ? "An essential local historic and cultural landmark." : lang === 'ja' ? "地域の歴史と文化を伝える重要なスポット。" : "一座历史深厚、底蕴丰富的人文地标。里面藏着许多有趣的故事。ပြင်",
                    hook: lang === 'en' ? "Explore inside to discover more." : lang === 'ja' ? "中に入って詳細なストーリーをチェックしましょう。" : "迈步走进去，咱们去解锁更多精彩的街头八卦与历史密码！"
                };
                subSpots = [
                    { title: "✨ 核心主建筑与历史遗迹", basic: lang === 'en' ? "Main historic structure preserving local heritage." : lang === 'ja' ? "地域の歴史を伝える主要な建物。" : "保存完好的地方标志性古建筑群与历史纪念碑。", anecdote: lang === 'en' ? "Countless local tales happened right here over the centuries." : lang === 'ja' ? "長年にわたり数々の物語が生まれた場所です。" : "百年来流传于街头巷尾的神秘传说与地方志奇闻。", photo: lang === 'en' ? "Classic front view angle." : lang === 'ja' ? "正面からのアングルがおすすめ。" : "建筑正面全景或局部精美木构特写。" }
                ];
            }

            return { macro, subSpots };
        }

        function toggleAudio(buttonElement, titleText, basicText, anecdoteText, photoText) {
            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音播报功能');
                return;
            }

            const t = i18n[currentLang];

            if (window.speechSynthesis.speaking && activeSpeechButton === buttonElement) {
                window.speechSynthesis.cancel();
                resetAudioButton(buttonElement);
                return;
            }

            window.speechSynthesis.cancel();
            if (activeSpeechButton) {
                resetAudioButton(activeSpeechButton);
            }

            let textToSpeak = `${titleText}. ${basicText}`;
            if (anecdoteText) textToSpeak += ` ${anecdoteText}`;
            if (photoText) textToSpeak += ` ${photoText}`;

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = t.speechLang; 
            utterance.rate = 0.95; 

            activeSpeechButton = buttonElement;
            buttonElement.innerText = t.stopBtn;
            buttonElement.classList.add('playing');

            utterance.onend = () => resetAudioButton(buttonElement);
            utterance.onerror = () => resetAudioButton(buttonElement);

            window.speechSynthesis.speak(utterance);
        }

        function resetAudioButton(btn) {
            if (!btn) return;
            const t = i18n[currentLang];
            btn.innerText = t.audioBtn;
            btn.classList.remove('playing');
            if (activeSpeechButton === btn) {
                activeSpeechButton = null;
            }
        }

        function renderSpots() {
            const container = document.getElementById('spots-container');
            container.innerHTML = '';
            const t = i18n[currentLang];

            let filteredSpots = allSpots.filter(spot => {
                const tags = spot.tags || {};
                let name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'] || '';
                
                let spotType = 'other';
                if (tags.leisure === 'park') spotType = 'park';
                else if (tags.historic) spotType = 'historic';
                else if (tags.tourism === 'museum') spotType = 'museum';

                if (currentCategory === 'recommend') {
                    return isLandmarkSpot(name, tags);
                }
                return spotType === currentCategory;
            });

            if (currentLat !== null && currentLon !== null) {
                filteredSpots.sort((a, b) => {
                    const latA = a.lat || (a.center && a.center.lat);
                    const lonA = a.lon || (a.center && a.center.lon);
                    const latB = b.lat || (b.center && b.center.lat);
                    const lonB = b.lon || (b.center && b.center.lon);

                    const distA = (latA && lonA) ? calculateDistance(currentLat, currentLon, latA, lonA) : 999999;
                    const distB = (latB && lonB) ? calculateDistance(currentLat, currentLon, latB, lonB) : 999999;
                    return distA - distB;
                });
            }

            if (filteredSpots.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-secondary); background: white; border-radius: var(--border-radius); box-shadow: 0 2px 8px rgba(0,0,0,0.04);">${t.noSpots}</div>`;
                return;
            }

            filteredSpots.forEach(spot => {
                const tags = spot.tags || {};
                let name = tags['name:zh'] || tags.name || tags['name:ja'] || '景点';
                if (currentLang === 'en') name = tags['name:en'] || tags.name || 'Location';
                if (currentLang === 'ja') name = tags['name:ja'] || tags.name || 'スポット';
                
                const spotLat = spot.lat || (spot.center && spot.center.lat);
                const spotLon = spot.lon || (spot.center && spot.center.lon);

                let distanceText = t.distanceWalk;
                if (currentLat !== null && currentLon !== null && spotLat && spotLon) {
                    const dist = calculateDistance(currentLat, currentLon, spotLat, spotLon);
                    if (dist > 0) {
                        distanceText = `${t.distancePrefix} ${dist} 米`;
                        if (currentLang === 'en') distanceText = `Distance: approx. ${dist}m`;
                        if (currentLang === 'ja') distanceText = `距離：約 ${dist}m`;
                    }
                }

                const mapUrl = (spotLat && spotLon) ? `https://www.google.com/maps/search/?api=1&query=${spotLat},${spotLon}` : '#';
                const isLandmark = isLandmarkSpot(name, tags);
                const hierarchicalData = getHierarchicalGuideContent(name, currentLang);

                const card = document.createElement('div');
                card.className = isLandmark ? 'spot-card landmark' : 'spot-card';
                
                let cardHtml = `
                    <div class="spot-title">🧭 ${name}</div>
                    <div class="spot-meta">${distanceText}</div>
                    
                    <!-- 宏观总览与进门钩子 -->
                    <div class="macro-overview-box">
                        ${t.macroLabel} ${hierarchicalData.macro.overview}<br><br>
                        🎯 <b>入园探秘指南：</b> <span style="color:#c0392b; font-weight:600;">${hierarchicalData.macro.hook}</span>
                    </div>
                    
                    <!-- 微观小景点嵌套列表 -->
                    <div class="sub-spots-header">${t.subSpotsHeader}</div>
                    <div class="sub-spots-container">
                `;

                hierarchicalData.subSpots.forEach(sub => {
                    cardHtml += `
                        <div class="sub-spot-card">
                            <div class="sub-spot-title">${sub.title}</div>
                            <div class="spot-desc-section">${t.labelOverview} ${sub.basic}</div>
                            <div class="spot-anecdote-section">${t.labelAnecdote} ${sub.anecdote}</div>
                            <div class="spot-photo-section">${t.labelPhoto} ${sub.photo}</div>
                            <div class="spot-actions">
                                <button class="action-btn audio" onclick="toggleAudio(this, '${sub.title.replace(/'/g, "\\'")}', '${sub.basic.replace(/'/g, "\\'")}', '${sub.anecdote.replace(/'/g, "\\'")}', '${sub.photo.replace(/'/g, "\\'")}')">${t.audioBtn}</button>
                            </div>
                        </div>
                    `;
                });

                cardHtml += `
                    </div>
                    <div class="spot-actions" style="margin-top: 15px;">
                        <a class="action-btn map" href="${mapUrl}" target="_blank">${t.mapBtn}</a>
                    </div>
                `;

                card.innerHTML = cardHtml;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
