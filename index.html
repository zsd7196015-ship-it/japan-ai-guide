<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 移动导览 | AI Mobile Tour Guide</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-secondary: #7f8c8d;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary-color);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button, select {
            padding: 10px 16px;
            font-size: 0.95rem;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            flex: 1;
            font-weight: 600;
        }

        button.primary:hover {
            background-color: #2980b9;
        }

        select {
            background-color: #fff;
        }

        .categories {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .cat-btn {
            padding: 6px 14px;
            font-size: 0.85rem;
            border-radius: 20px;
            border: 1px solid #dcdde1;
            background: #fff;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .cat-btn.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        #status {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-align: center;
        }

        .spot-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spot-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 4px solid var(--accent-color);
            transition: transform 0.2s;
        }

        .spot-card:hover {
            transform: translateY(-2px);
        }

        .spot-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--primary-color);
        }

        .spot-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .spot-desc {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #4f5d73;
        }

        .spot-distance {
            font-size: 0.85rem;
            color: #e67e22;
            font-weight: 600;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="ui-title">📍 AI 移动导览</h1>
            <select id="lang-select" onchange="changeLanguage()">
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
            </select>
        </header>

        <div class="controls">
            <button class="primary" id="btn-gps" onclick="getLocationAndSearch()">获取实时GPS并探索周边景点</button>
        </div>

        <div class="categories">
            <button class="cat-btn active" onclick="filterCategory('all', this)" id="cat-all">全部/热门</button>
            <button class="cat-btn" onclick="filterCategory('historic', this)" id="cat-historic">历史古迹</button>
            <button class="cat-btn" onclick="filterCategory('park', this)" id="cat-park">公园绿地</button>
            <button class="cat-btn" onclick="filterCategory('museum', this)" id="cat-museum">博物馆/文化</button>
        </div>

        <div id="status">请点击上方按钮获取位置并加载周边景点...</div>
        <div class="spot-list" id="spots-container"></div>
    </div>

    <script>
        let currentLat = null;
        let currentLon = null;
        let currentCategory = 'all';
        let allSpots = [];

        const i18n = {
            zh: { title: "📍 AI 移动导览", btn: "获取实时GPS并探索周边景点", statusLoc: "正在获取您的 GPS 位置...", statusLoading: "正在查询周边优质景点...", statusReady: "为您找到以下周边景点：", distLabel: "直线距离约：", errLoc: "无法获取您的地理位置，请确保浏览器已授权定位。", errApi: "获取景点数据失败，请稍后重试。", catAll: "全部/热门", catHist: "历史古迹", catPark: "公园绿地", catMuseum: "博物馆/文化" },
            en: { title: "📍 AI Mobile Tour Guide", btn: "Get GPS & Explore", statusLoc: "Getting your GPS location...", statusLoading: "Searching nearby tourist spots...", statusReady: "Nearby spots found:", distLabel: "Straight-line distance approx: ", errLoc: "Unable to get your location. Please check GPS permissions.", errApi: "Failed to fetch spots. Please try again later.", catAll: "All/Popular", catHist: "Historic", catPark: "Parks", catMuseum: "Museums" },
            ja: { title: "📍 AI モバイルガイド", btn: "GPSを取得して周辺を探索", statusLoc: "GPS位置情報を取得中...", statusLoading: "周辺の観光スポットを検索中...", statusReady: "周辺のスポットが見つかりました：", distLabel: "直線距離約：", errLoc: "位置情報を取得できませんでした。権限を確認してください。", errApi: "スポットの取得に失敗しました。後でお試しください。", catAll: "すべて/人気", catHist: "歴史的スポット", catPark: "公園", catMuseum: "美術館/博物館" }
        };

        function changeLanguage() {
            const lang = document.getElementById('lang-select').value;
            document.getElementById('ui-title').innerText = i18n[lang].title;
            document.getElementById('btn-gps').innerText = i18n[lang].btn;
            document.getElementById('cat-all').innerText = i18n[lang].catAll;
            document.getElementById('cat-historic').innerText = i18n[lang].catHist;
            document.getElementById('cat-park').innerText = i18n[lang].catPark;
            document.getElementById('cat-museum').innerText = i18n[lang].catMuseum;
            renderSpots();
        }

        function getLocationAndSearch() {
            const lang = document.getElementById('lang-select').value;
            const statusEl = document.getElementById('status');
            
            if (!navigator.geolocation) {
                statusEl.innerText = "您的浏览器不支持地理定位";
                return;
            }

            statusEl.innerText = i18n[lang].statusLoc;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    fetchSpots(currentLat, currentLon);
                },
                (error) => {
                    statusEl.innerText = i18n[lang].errLoc;
                    console.error(error);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function fetchSpots(lat, lon) {
            const lang = document.getElementById('lang-select').value;
            const statusEl = document.getElementById('status');
            statusEl.innerText = i18n[lang].statusLoading;

            const query = `
                [out:json][timeout:25];
                (
                  node(around:1500,${lat},${lon})[historic];
                  way(around:1500,${lat},${lon})[historic];
                  node(around:1500,${lat},${lon})[tourism];
                  way(around:1500,${lat},${lon})[tourism];
                  node(around:1500,${lat},${lon})[leisure=park];
                  way(around:1500,${lat},${lon})[leisure=park];
                );
                out center;
            `;

            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query
                });
                const data = await response.json();
                
                allSpots = data.elements.filter(item => {
                    const tags = item.tags || {};
                    const name = tags.name || tags['name:en'] || tags['name:ja'] || tags['name:zh'];
                    if (!name) return false;

                    const amenity = tags.amenity;
                    const office = tags.office;
                    if (['school', 'university', 'kindergarten', 'hospital', 'parking', 'townhall', 'police', 'fire_station'].includes(amenity)) {
                        return false;
                    }
                    if (office) return false;

                    return true;
                });

                statusEl.innerText = i18n[lang].statusReady;
                renderSpots();
            } catch (err) {
                statusEl.innerText = i18n[lang].errApi;
                console.error(err);
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return Math.round(R * c);
        }

        function filterCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderSpots();
        }

        function renderSpots() {
            const container = document.getElementById('spots-container');
            const lang = document.getElementById('lang-select').value;
            container.innerHTML = '';

            if (allSpots.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-secondary);">${lang === 'en' ? 'No spots found nearby.' : lang === 'ja' ? '周辺にスポットが見つかりません。' : '附近暂无符合条件的景点。'}</div>`;
                return;
            }

            allSpots.forEach(spot => {
                const tags = spot.tags || {};
                const name = tags.name || tags['name:en'] || tags['name:ja'] || tags['name:zh'] || '未知地点';
                
                let spotType = 'other';
                let typeLabel = lang === 'en' ? 'Attraction' : lang === 'ja' ? '観光地' : '热门景点';
                if (tags.historic) {
                    spotType = 'historic';
                    typeLabel = lang === 'en' ? 'Historic Site' : lang === 'ja' ? '歴史的スポット' : '历史古迹';
                } else if (tags.leisure === 'park') {
                    spotType = 'park';
                    typeLabel = lang === 'en' ? 'Park' : lang === 'ja' ? '公園' : '公园绿地';
                } else if (tags.tourism === 'museum') {
                    spotType = 'museum';
                    typeLabel = lang === 'en' ? 'Museum' : lang === 'ja' ? '博物館' : '博物馆/文化';
                }

                if (currentCategory !== 'all' && currentCategory !== spotType) {
                    return;
                }

                const spotLat = spot.lat || (spot.center && spot.center.lat);
                const spotLon = spot.lon || (spot.center && spot.center.lon);

                let distanceHtml = '';
                if (currentLat !== null && currentLon !== null && spotLat && spotLon) {
                    const dist = calculateDistance(currentLat, currentLon, spotLat, spotLon);
                    // 严格过滤：只有距离大于 0 时才显示距离行，绝不显示 0 米
                    if (dist > 0) {
                        distanceHtml = `<div class="spot-distance">📍 ${i18n[lang].distLabel}${dist} 米</div>`;
                    }
                }

                const card = document.createElement('div');
                card.className = 'spot-card';
                card.innerHTML = `
                    <div class="spot-title">${name}</div>
                    <div class="spot-meta">
                        <span>${typeLabel}</span>
                    </div>
                    ${distanceHtml}
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
