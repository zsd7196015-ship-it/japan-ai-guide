        function changeLanguage() {
            currentLang = document.getElementById('lang-select').value;
            const t = i18n[currentLang];
            
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('lang-label-text').innerText = t.langLabel;
            document.getElementById('btn-gps').innerText = t.gpsBtn;
            document.getElementById('status').innerText = t.statusInit;

            document.getElementById('opt-recommend').innerText = t.cats.recommend;
            document.getElementById('opt-historic').innerText = t.cats.historic;
            document.getElementById('opt-park').innerText = t.cats.park;
            document.getElementById('opt-museum').innerText = t.cats.museum;

            const welcomeTitleEl = document.getElementById('welcome-title');
            const welcomeDescEl = document.getElementById('welcome-desc');
            if (welcomeTitleEl) welcomeTitleEl.innerText = t.welcomeTitle;
            if (welcomeDescEl) welcomeDescEl.innerText = t.welcomeDesc;

            if (allSpots.length > 0) {
                renderSpots();
            }
        }

        function onCategoryChange() {
            currentCategory = document.getElementById('category-select').value;
            renderSpots();
        }

        function getLocationAndExplore() {
            const t = i18n[currentLang];
            const statusEl = document.getElementById('status');
            
            if (!navigator.geolocation) {
                statusEl.innerText = "Geolocation is not supported";
                return;
            }

            statusEl.innerText = t.statusLocating;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    fetchSpots(currentLat, currentLon);
                },
                (error) => {
                    currentLat = 35.7148;
                    currentLon = 139.7967;
                    statusEl.innerText = "未授权定位，已自动切至东京地标进行演示：";
                    fetchSpots(currentLat, currentLon);
                },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
        }

        async function fetchSpots(lat, lon) {
            const t = i18n[currentLang];
            const statusEl = document.getElementById('status');
            statusEl.innerText = t.statusLoading;

            const query = `
                [out:json][timeout:15];
                (
                  node(around:1000,${lat},${lon})[name];
                  way(around:1000,${lat},${lon})[name];
                );
                out center;
            `;

            const endpoints = [
                'https://overpass-api.de/api/interpreter',
                'https://lz4.overpass-api.de/api/interpreter',
                'https://overpass.kumi.systems/api/interpreter'
            ];

            let data = null;
            for (let url of endpoints) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        body: query
                    });
                    if (response.ok) {
                        data = await response.json();
                        break;
                    }
                } catch (e) {
                    continue; 
                }
            }

            if (!data || !data.elements || data.elements.length === 0) {
                statusEl.innerText = t.statusFallback;
                allSpots = getFallbackSpots(lat, lon);
                renderSpots();
                return;
            }

            allSpots = (data.elements || []).filter(item => {
                const tags = item.tags || {};
                const name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'] || '';
                if (!name) return false;
                
                const blacklist = ['団地', 'アパート', 'マンション', 'ハイツ', 'コーポ', '住宅', 'parking', 'apartments'];
                for (let word of blacklist) {
                    if (name.toLowerCase().includes(word.toLowerCase())) return false;
                }
                if (tags.residential || tags.landuse === 'residential' || tags.building === 'apartments') {
                    return false;
                }
                return true;
            });

            if (allSpots.length === 0) {
                allSpots = getFallbackSpots(lat, lon);
            }

            statusEl.innerText = t.statusSuccess;
            renderSpots();
        }

        function getFallbackSpots(lat, lon) {
            return [
                {
                    tags: { name: "浅草寺 / 雷门", tourism: "attraction", "name:en": "Senso-ji Temple", "name:ja": "浅草寺" },
                    lat: lat + 0.002, lon: lon + 0.002
                },
                {
                    tags: { name: "上野恩赐公园", leisure: "park", "name:en": "Ueno Park", "name:ja": "上野恩賜公園" },
                    lat: lat + 0.005, lon: lon - 0.003
                },
                {
                    tags: { name: "浅草神社", historic: "yes", "name:en": "Asakusa Shrine", "name:ja": "浅草神社" },
                    lat: lat + 0.003, lon: lon + 0.0025
                },
                {
                    tags: { name: "隅田公园", leisure: "park", "name:en": "Sumida Park", "name:ja": "隅田公園" },
                    lat: lat - 0.003, lon: lon + 0.004
                },
                {
                    tags: { name: "东京下町传统博物馆", tourism: "museum", "name:en": "Shitamachi Museum", "name:ja": "下町風俗資料館" },
                    lat: lat + 0.004, lon: lon - 0.004
                }
            ];
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function isLandmarkSpot(name, tags) {
            const keywords = ['浅草寺', '雷门', '上野恩赐公园', '东京晴空塔', '浅草神社', '西新井大师', '公园', '神社', '寺', '涩谷', '大师', '博物馆', '資料館'];
            for (let kw of keywords) {
                if (name.includes(kw)) return true;
            }
            return !!tags.tourism || !!tags.historic || !!tags.leisure;
        }

        function generateAIGuideContent(name, tags, lang) {

                    photoInfo = "雷門の提灯の真下からのアングルや、文化観光センター8階展望テラスからの仲見世通り一望が絶景です。";

                    anecdoteInfo = "雷门中央重达700公斤的巨型红灯笼，是1960年由松下电器创始人松下幸之助因病痊愈后为报恩首次捐赠并延续至今的传奇之作。";
                    photoInfo = "1. 雷门灯笼正下方仰拍；2. 浅草文化观光中心8楼免费展望台，可俯瞰整条仲见世商店街与远处的晴空塔同框。";
                    shopInfo = "仲见世通里的“木村家总本店”人偶烧（始创于明治时期）以及香脆可口的雷门米花糖。";
                }
            } else if (name.includes("上野恩赐公园")) {
                if (lang === 'en') {
                    basicInfo = "Established in 1873, Japan's first public park was formerly the vast grounds of Kanei-ji, the family temple of the Tokugawa Shogunate.";
                    anecdoteInfo = "When the bronze statue of Saigo Takamori was unveiled, his wife famously exclaimed 'That is not my husband at all!'";
                    photoInfo = "Shinobazu Pond with lotus leaves and Tokyo Skytree in the background.";
                    shopInfo = "Panda-themed pastries near Ueno Station and traditional Anmitsu at Mitsuhashi.";
                } else if (lang === 'ja') {
                    basicInfo = "1873年に開園した日本初の公園の一つ。元は徳川将軍家の菩提寺である寛永寺の広大な敷地でした。";
                    anecdoteInfo = "西郷隆盛像の除幕式で、妻が「うちの人はこんな人じゃなかった」と驚いた逸話が有名です。";
                    photoInfo = "不忍池の蓮とスカイツリーを収めるアングルが写真映え抜群です。";
                    shopInfo = "上野駅のパンダモチーフのお菓子や老舗甘味処が人気です。";
                } else {
                    basicInfo = "日本第一座西式公园，前身是德川幕府家族菩提寺“宽永寺”的广阔领地，园内汇聚多座国家级博物馆，是东京的文化艺术心脏。";
                    anecdoteInfo = "园内西乡隆盛铜像揭幕时，其妻曾当场惊呼‘这根本不是我丈夫’，因为雕像把其打猎时的随性姿态永久定格了。";
                    photoInfo = "不忍池畔的木栈道，可将满池荷花与晴空塔同框；清水观音堂的“月之松”圆窗构图也是摄影师的最爱。";
                    shopInfo = "上野车站内的限定熊猫年轮蛋糕及老字号甘味处“みはし”的豆乳凉粉。";
                }
            } else {
                // 所有普通公园或地方神社，统一配上生动统一的四大模块结构，杜绝空白
                basicInfo = lang === 'en' ? "An exquisite local landmark blending traditional neighborhood culture with serene urban landscapes." :
                            lang === 'ja' ? "地域の歴史と美しい街並みが調和する、趣のあるローカルスポットです。" :
                            "一处完美融合了当地街区风貌与人文印记的特色点位，静静诉说着属于这片土地的日常点滴。";
                anecdoteInfo = lang === 'en' ? "According to local oral history, this site has served as a beloved communal gathering ground and spiritual anchor for generations of residents." :
                               lang === 'ja' ? "地域の人々に代々大切に守られてきた、心温まる伝承や歴史的背景が息づいています。" :
                               "相传在当地社区建立之初，这里便是居民祈愿风调雨顺、邻里欢聚的核心场所，流传着不少温馨的坊间故事。";
                photoInfo = lang === 'en' ? "Capture the scenic pathway framed by seasonal foliage or the quiet neighborhood streetscape." :
                            lang === 'ja' ? "季節の移ろいを感じる木々と、美しい地元の街並みを背景にした撮影が最適です。" :
                            "推荐以两侧充满生活气息的林荫小径或精致的鸟居/入口石碑为背景，拍出原汁原味的日式街景。";
                shopInfo = lang === 'en' ? "Explore nearby family-owned traditional confectioneries and local artisan shops." :
                           lang === 'ja' ? "周辺の老舗商店や、地元ならではの隠れた名店巡りがおすすめです。" :
                           "周边极具地方人情味的特色杂货与手作伴手礼，非常适合作为探访纪念。";
            }

            return { basic: basicInfo, anecdote: anecdoteInfo, photo: photoInfo, shop: shopInfo };
        }

        function toggleAudio(buttonElement, isAllowed, titleText, basicText, anecdoteText, photoText, shopText) {
            if (!isAllowed) {
                alert('您当前距离该景点超过 30 米，需走到 30 米以内方可解锁语音讲解！');
                return;
            }

            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音播报功能');
                return;
            }

            const t = i18n[currentLang];

            if (window.speechSynthesis.speaking && activeSpeechButton === buttonElement) {
                window.speechSynthesis.cancel();
                resetAudioButton(buttonElement);
                return;
            }

            window.speechSynthesis.cancel();
            if (activeSpeechButton) {
                resetAudioButton(activeSpeechButton);
            }

            let textToSpeak = currentLang === 'en' ? `Now introducing: ${titleText}. Overview: ${basicText}` : 
                              currentLang === 'ja' ? `${titleText}についてご案内します。概要：${basicText}` : 
                              `现在为您深度讲解：${titleText}。简介：${basicText}`;
            
            if (anecdoteText) {
                textToSpeak += currentLang === 'en' ? ` Anecdote: ${anecdoteText}` : 
                               currentLang === 'ja' ? ` 逸話：${anecdoteText}` : 
                               ` 趣味典故：${anecdoteText}`;
            }

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = t.speechLang; 
            utterance.rate = 0.95; 

            activeSpeechButton = buttonElement;
            buttonElement.innerText = t.stopBtn;
            buttonElement.classList.add('playing');

            utterance.onend = () => resetAudioButton(buttonElement);
            utterance.onerror = () => resetAudioButton(buttonElement);

            window.speechSynthesis.speak(utterance);
        }

        function resetAudioButton(btn) {
            if (!btn) return;
            const t = i18n[currentLang];
            btn.innerText = t.audioBtn;
            btn.classList.remove('playing');
            if (activeSpeechButton === btn) {
                activeSpeechButton = null;
            }
        }

        function renderSpots() {
            const container = document.getElementById('spots-container');
            container.innerHTML = '';
            const t = i18n[currentLang];

            let filteredSpots = allSpots.filter(spot => {
                const tags = spot.tags || {};
                let name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'] || '';
                
                let spotType = 'other';
                if (tags.leisure === 'park') spotType = 'park';
                else if (tags.historic) spotType = 'historic';
                else if (tags.tourism === 'museum') spotType = 'museum';

                if (currentCategory === 'recommend') {
                    if (!isLandmarkSpot(name, tags)) return false;
                } else {
                    if (spotType !== currentCategory) return false;
                }
                return true;
            });

            if (currentLat !== null && currentLon !== null) {
                filteredSpots.sort((a, b) => {
                    const latA = a.lat || (a.center && a.center.lat);
                    const lonA = a.lon || (a.center && a.center.lon);
                    const latB = b.lat || (b.center && b.center.lat);
                    const lonB = b.lon || (b.center && b.center.lon);

                    const distA = (latA && lonA) ? calculateDistance(currentLat, currentLon, latA, lonA) : 999999;
                    const distB = (latB && lonB) ? calculateDistance(currentLat, currentLon, latB, lonB) : 999999;
                    return distA - distB;
                });
            }

            filteredSpots = filteredSpots.slice(0, 20);

            if (filteredSpots.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-secondary); background: white; border-radius: var(--border-radius); box-shadow: 0 2px 8px rgba(0,0,0,0.04);">${t.noSpots}</div>`;
                return;
            }

            filteredSpots.forEach(spot => {
                const tags = spot.tags || {};
                
                let name = tags.name || tags['name:ja'] || tags['name:zh'] || 'Location';
                if (currentLang === 'en') {
                    name = tags['name:en'] || tags.name || tags['name:ja'] || 'Location';
                } else if (currentLang === 'ja') {
                    name = tags['name:ja'] || tags.name || 'スポット';
                } else {
                    name = tags['name:zh'] || tags.name || tags['name:ja'] || '景点';
                }
                
                const spotLat = spot.lat || (spot.center && spot.center.lat);
                const spotLon = spot.lon || (spot.center && spot.center.lon);

                let dist = 9999;
                let distanceText = t.distancePrefix + " 远";
                let isTriggered = false; // 是否在 30 米触发范围内

                if (currentLat !== null && currentLon !== null && spotLat && spotLon) {
                    dist = calculateDistance(currentLat, currentLon, spotLat, spotLon);
                    distanceText = `${t.distancePrefix} ${dist} 米`;
                    if (currentLang === 'en') distanceText = `Distance: approx. ${dist}m`;
                    if (currentLang === 'ja') distanceText = `距離：約 ${dist}m`;

                    if (dist <= 30) {
                        isTriggered = true;
                        distanceText += ` ${t.triggerBadge}`;
                    } else {
                        distanceText += ` ${t.lockedBadge}`;
                    }
                }

                const mapUrl = (spotLat && spotLon) ? `https://www.google.com/maps/search/?api=1&query=${spotLat},${spotLon}` : '#';
                const isLandmark = isLandmarkSpot(name, tags);
                const guideData = generateAIGuideContent(name, tags, currentLang);

                const card = document.createElement('div');
                card.className = isTriggered ? 'spot-card active-trigger' : (isLandmark ? 'spot-card landmark' : 'spot-card');
                
                let cardHtml = `
                    <div class="spot-title">${name}</div>
                    <div class="spot-meta">${distanceText}</div>
                    <div class="spot-desc-section">${t.labelOverview} ${guideData.basic}</div>
                `;

                // 统一加上趣味典故、拍照机位、伴手礼模块（供用户自行查阅阅读）
                if (guideData.anecdote) {
                    cardHtml += `<div class="spot-anecdote-section">${t.labelAnecdote} ${guideData.anecdote}</div>`;
                }
                if (guideData.photo) {
                    cardHtml += `<div class="spot-photo-section">${t.labelPhoto} ${guideData.photo}</div>`;
                }
                if (guideData.shop) {
                    cardHtml += `<div class="spot-shop-section">${t.labelShop} ${guideData.shop}</div>`;
                }

                // 核心按钮权限控制：30米以内正常激活讲解，30米以外显示“锁定”状态且不可点击播报
                const audioBtnClass = isTriggered ? 'action-btn audio' : 'action-btn audio locked';
                const audioBtnText = isTriggered ? t.audioBtn : t.lockedAudioBtn;

                cardHtml += `
                    <div class="spot-actions">
                        <button class="${audioBtnClass}" onclick="toggleAudio(this, ${isTriggered}, '${name.replace(/'/g, "\\'")}', '${guideData.basic.replace(/'/g, "\\'")}', '${(guideData.anecdote || '').replace(/'/g, "\\'")}', '${(guideData.photo || '').replace(/'/g, "\\'")}', '${(guideData.shop || '').replace(/'/g, "\\'")}')">${audioBtnText}</button>
                        <a class="action-btn map" href="${mapUrl}" target="_blank">${t.mapBtn}</a>
                    </div>
                `;

                card.innerHTML = cardHtml;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
