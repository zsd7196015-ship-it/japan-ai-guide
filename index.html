        // 全局系统音频优先级打断监听（来电、切后台、锁屏、关闭网页）
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) stopCurrentSpeech();
        });
        window.addEventListener('pagehide', () => stopCurrentSpeech());
        window.addEventListener('beforeunload', () => stopCurrentSpeech());

        function stopCurrentSpeech() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (activeSpeechButton) resetAudioButton(activeSpeechButton);
        }

        function changeLanguage() {
            stopCurrentSpeech();
            currentLang = document.getElementById('lang-select').value;
            const t = i18n[currentLang];
            
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('lang-label-text').innerText = t.langLabel;
            document.getElementById('btn-gps').innerText = t.gpsBtn;
            document.getElementById('status').innerText = t.statusInit;

            document.getElementById('opt-major').innerText = t.cats.major;
            document.getElementById('opt-minor').innerText = t.cats.minor;
            document.getElementById('opt-historic').innerText = t.cats.historic;

            document.getElementById('welcome-title').innerText = t.welcomeTitle;
            document.getElementById('welcome-desc').innerText = t.welcomeDesc;

            if (allSpots.length > 0) renderSpots();
        }

        function onCategoryChange() {
            stopCurrentSpeech();
            currentCategory = document.getElementById('category-select').value;
            renderSpots();
        }

        function getLocationAndExplore() {
            stopCurrentSpeech();
            const t = i18n[currentLang];
            const statusEl = document.getElementById('status');
            
            if (!navigator.geolocation) {
                statusEl.innerText = "Geolocation not supported";
                return;
            }

            statusEl.innerText = t.statusLocating;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    fetchSpots(currentLat, currentLon);
                },
                () => { statusEl.innerText = t.statusErrorGPS; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function fetchSpots(lat, lon) {
            const t = i18n[currentLang];
            const statusEl = document.getElementById('status');
            statusEl.innerText = t.statusLoading;

            // 纯文化、历史、古迹、寺庙、公园、地标查询（彻底排除吃喝买）
            const query = `
                [out:json][timeout:25];
                (
                  node(around:1500,${lat},${lon})[historic];
                  way(around:1500,${lat},${lon})[historic];
                  node(around:1500,${lat},${lon})[tourism];
                  way(around:1500,${lat},${lon})[tourism];
                  node(around:1500,${lat},${lon})[leisure=park];
                  way(around:1500,${lat},${lon})[leisure=park];
                  node(around:1500,${lat},${lon})[amenity=place_of_worship];
                  way(around:1500,${lat},${lon})[amenity=place_of_worship];
                );
                out center;
            `;

            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query
                });
                const data = await response.json();
                
                allSpots = data.elements.filter(item => {
                    const tags = item.tags || {};
                    const name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'] || '';
                    if (!name) return false;
                    
                    // 过滤无关的居民区、团地、医院、学校等
                    const blacklist = ['团地', '団地', 'アパート', 'マンション', 'ハイツ', 'コーポ', '住宅', 'school', 'hospital', 'university', 'parking', 'police', 'apartments'];
                    for (let word of blacklist) {
                        if (name.toLowerCase().includes(word.toLowerCase())) return false;
                    }
                    if (tags.residential || tags.landuse === 'residential' || tags.building === 'apartments') return false;
                    
                    return true;
                });

                statusEl.innerText = t.statusSuccess;
                renderSpots();
            } catch (err) {
                statusEl.innerText = t.statusErrorFetch;
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        // ==========================================
        // 核心算法：智能区分“大景点”与“小景点”
        // ==========================================
        function classifySpotTier(name, tags, element) {
            // 1. 全球/全东京顶级大IP硬编码白名单
            const superLandmarks = ['皇居', '浅草寺', '雷门', '上野恩赐公园', '东京晴空塔', '明治神宫', '浅草神社', '西新井大师', '浜离宫'];
            if (superLandmarks.some(kw => name.includes(kw))) {
                return 'MAJOR';
            }

            // 2. 结构特征与标签权重算法
            let score = 0;
            // 面积大（闭合多边形 way）说明体量大
            if (element.type === 'way') score += 4;
            // 官方核心旅游或历史宫殿城堡标签
            if (tags.tourism === 'attraction') score += 3;
            if (tags.historic === 'castle' || tags.historic === 'palace' || tags.historic === 'monument') score += 4;
            
            // 关键词权重
            const majorKeywords = ['寺', '神宫', '大社', '城', '博物馆', '苑', '园', 'tower', '宮'];
            for (let kw of majorKeywords) {
                if (name.includes(kw)) score += 2;
            }

            // 总分 >= 5 判定为大景点，否则为街头小景点
            return score >= 5 ? 'MAJOR' : 'MINOR';
        }

                anecdoteInfo = lang === 'en' ? "When Saigo Takamori's statue was unveiled, his wife exclaimed 'That's not my husband!'" :
                               lang === 'ja' ? "西郷隆盛像の除幕式で、妻が『うちの人はこんな人じゃなかった』と言った逸話が有名です。" :
                               "【宫廷野史】园内西乡隆盛铜像揭幕时，其妻曾当场惊呼‘这根本不是我丈夫’，因为雕像把其打猎时的随性姿态永久定格，打破了当时日本武士严苛的肖像规制。";
                photoInfo = lang === 'en' ? "Shinobazu Pond lotus leaves with Skytree background." :
                            lang === 'ja' ? "不忍池の蓮とスカイツリーを収めるアングルが写真映え抜群です。" :
                            "不忍池畔的木栈道，可将满池荷花与晴空塔同框；清水观音堂的“月之松”圆窗构图也是摄影经典。";
            } else if (tier === 'MAJOR') {
                // 大景点通用厚重历史模板
                basicInfo = lang === 'en' ? "A magnificent landmark steeped in historical significance and architectural mastery." :
                            lang === 'ja' ? "歴史的重みと優れた建築様式を誇る壮大なランドマークです。" :
                            "这是一处体量宏大、规制完备的重量级历史地标。其建筑风格与历代幕府或地方统治者的权力变迁息息相关。";
                anecdoteInfo = lang === 'en' ? "Countless historical political shifts and secret alliances took place behind these walls." :
                               lang === 'ja' ? "この場所の裏では、数々の歴史的政治転換や密約が交わされてきました。" :
                               "【深度秘闻】在古代，此处曾是左右区域政局的核心禁地。民间流传着诸多关于历代权贵在此密谋、显灵或遭遇离奇变故的野史传说。";
                photoInfo = lang === 'en' ? "Capture the grand gate and structural axis from the front plaza." :
                            lang === 'ja' ? "正面広場からの壮麗な門と建物の軸線を捉えた撮影がおすすめです。" :
                            "建议在主入口广场的中轴线上取景，或寻找侧面庭廊的借景构图。";
            } else {
                // 小景点短平快“秘闻直出”模板
                basicInfo = lang === 'en' ? "A quaint local historical site preserving forgotten neighborhood folklore." :
                            lang === 'ja' ? "忘れ去られた地域の伝承を静かに伝える趣のあるローカルスポットです。" :
                            "这是一处隐藏在街头巷尾的精巧冷门古迹。虽然名气不大，但却完整保留了极具地方色彩的古老传说。";
                anecdoteInfo = lang === 'en' ? "Local folklore says this spot was once protected by mystical forces during the Edo period." :
                               lang === 'ja' ? "江戸時代からこの場所を守る不思議な言い伝えが地元に残されています。" :
                               "【独家民间传奇】据当地旧志记载，江户时代这里曾发生过一桩轰动一时的民间奇闻。虽然历经沧桑，但当地人至今对这里的古老石碑或建筑心存敬畏。";
                photoInfo = lang === 'en' ? "Close-up of the historical stone monument or traditional architectural details." :
                            lang === 'ja' ? "歴史ある石碑や伝統的な建築ディテールのクローズアップ撮影が最適です。" :
                            "适合对石碑铭文、古树或传统雕刻细节进行近距离特写拍摄。";
            }

            return { basic: basicInfo, anecdote: anecdoteInfo, photo: photoInfo };
        }

        function toggleAudio(buttonElement, titleText, basicText, anecdoteText, photoText, isNearby) {
            if (!('speechSynthesis' in window)) {
                alert('语音播报不支持');
                return;
            }

            const t = i18n[currentLang];

            if (window.speechSynthesis.speaking && activeSpeechButton === buttonElement) {
                window.speechSynthesis.cancel();
                resetAudioButton(buttonElement);
                return;
            }

            window.speechSynthesis.cancel();
            if (activeSpeechButton) resetAudioButton(activeSpeechButton);

            let textToSpeak = `${titleText}。${basicText}`;
            if (isNearby) {
                if (anecdoteText) textToSpeak += ` ${anecdoteText}`;
                if (photoText) textToSpeak += ` 构图建议：${photoText}`;
            }

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = t.speechLang;
            utterance.rate = 0.95;

            activeSpeechButton = buttonElement;
            buttonElement.innerText = t.stopBtn;
            buttonElement.classList.add('playing');

            utterance.onend = () => resetAudioButton(buttonElement);
            utterance.onerror = () => resetAudioButton(buttonElement);

            window.speechSynthesis.speak(utterance);
        }

        function resetAudioButton(btn) {
            if (!btn) return;
            const t = i18n[currentLang];
            btn.innerText = t.audioBtn;
            btn.classList.remove('playing');
            if (activeSpeechButton === btn) activeSpeechButton = null;
        }

        function renderSpots() {
            const container = document.getElementById('spots-container');
            container.innerHTML = '';
            const t = i18n[currentLang];

            let filteredSpots = allSpots.filter(spot => {
                const tags = spot.tags || {};
                let name = tags.name || tags['name:ja'] || tags['name:zh'] || '';
                
                const tier = classifySpotTier(name, tags, spot);
                let isHistoric = !!tags.historic || tags.amenity === 'place_of_worship' || name.includes('寺') || name.includes('神社');

                if (currentCategory === 'major') {
                    return tier === 'MAJOR';
                } else if (currentCategory === 'minor') {
                    return tier === 'MINOR';
                } else if (currentCategory === 'historic') {
                    return isHistoric;
                } else {
                    return true;
                }
            });

            // 按距离由近到远排序
            if (currentLat !== null && currentLon !== null) {
                filteredSpots.sort((a, b) => {
                    const latA = a.lat || (a.center && a.center.lat);
                    const lonA = a.lon || (a.center && a.center.lon);
                    const latB = b.lat || (b.center && b.center.lat);
                    const lonB = b.lon || (b.center && b.center.lon);

                    const distA = (latA && lonA) ? calculateDistance(currentLat, currentLon, latA, lonA) : 999999;
                    const distB = (latB && lonB) ? calculateDistance(currentLat, currentLon, latB, lonB) : 999999;
                    return distA - distB;
                });
            }

            if (filteredSpots.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-secondary); background: white; border-radius: var(--border-radius); box-shadow: 0 2px 8px rgba(0,0,0,0.04);">${t.noSpots}</div>`;
                return;
            }

            filteredSpots.forEach(spot => {
                const tags = spot.tags || {};
                let name = tags['name:' + currentLang] || tags.name || tags['name:ja'] || tags['name:zh'] || '历史古迹';
                
                const spotLat = spot.lat || (spot.center && spot.center.lat);
                const spotLon = spot.lon || (spot.center && spot.center.lon);

                let distanceVal = 999;
                let distanceText = t.distanceWalk;
                if (currentLat !== null && currentLon !== null && spotLat && spotLon) {
                    distanceVal = calculateDistance(currentLat, currentLon, spotLat, spotLon);
                    if (distanceVal > 0) {
                        distanceText = `${t.distancePrefix} ${distanceVal} 米`;
                        if (currentLang === 'en') distanceText = `Distance: approx. ${distanceVal}m`;
                        if (currentLang === 'ja') distanceText = `距離：約 ${distanceVal}m`;
                    }
                }

                const mapUrl = (spotLat && spotLon) ? `https://www.google.com/maps/search/?api=1&query=${spotLat},${spotLon}` : '#';
                
                // 核心算法判定是大点还是小点
                const tier = classifySpotTier(name, tags, spot);
                const isMajor = (tier === 'MAJOR');
                const guideData = generateAIGuideContent(name, tags, tier, currentLang);
                const isNearby = (distanceVal <= 20);

                const card = document.createElement('div');
                card.className = isMajor ? 'spot-card major-spot' : 'spot-card';
                
                const badgeHtml = isMajor ? `<div class="tier-badge major">${t.majorBadge}</div>` : `<div class="tier-badge minor">${t.minorBadge}</div>`;

                let cardHtml = `
                    ${badgeHtml}
                    <div class="spot-title">${name}</div>
                    <div class="spot-meta">${distanceText}</div>
                    <div class="spot-desc-section">${t.labelOverview} ${guideData.basic}</div>
                `;

                if (isNearby) {
                    if (guideData.anecdote) {
                        cardHtml += `<div class="spot-anecdote-section">${t.labelAnecdote} ${guideData.anecdote}</div>`;
                    }
                    if (guideData.photo) {
                        cardHtml += `<div class="spot-photo-section">${t.labelPhoto} ${guideData.photo}</div>`;
                    }
                } else {
                    cardHtml += `<div class="proximity-notice">${t.nearbyNotice}</div>`;
                }

                cardHtml += `
                    <div class="spot-actions">
                        <button class="action-btn audio" onclick="toggleAudio(this, '${name.replace(/'/g, "\\'")}', '${guideData.basic.replace(/'/g, "\\'")}', '${(guideData.anecdote || '').replace(/'/g, "\\'")}', '${(guideData.photo || '').replace(/'/g, "\\'")}', ${isNearby})">${t.audioBtn}</button>
                        <a class="action-btn map" href="${mapUrl}" target="_blank">${t.mapBtn}</a>
                    </div>
                `;

                card.innerHTML = cardHtml;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
