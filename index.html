<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Japan AI Guide Web V2.0</title>

<style>

body{
    margin:0;
    padding:12px;
    background:#f4f6f8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
    max-width:450px;
    margin:auto;
}

.header{
    background:#fff;
    padding:14px;
    border-radius:12px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.title{
    font-size:20px;
    font-weight:bold;
}

.subtitle{
    font-size:13px;
    color:#666;
    margin-top:4px;
}

.lang{
    width:100%;
    height:40px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ddd;
}

.refresh{
    width:100%;
    height:42px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#27ae60;
    color:#fff;
    font-weight:bold;
}

.status{
    margin-top:10px;
    color:#555;
    font-size:13px;
}

.spot{
    background:#fff;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.name{
    font-size:16px;
    font-weight:bold;
}

.distance{
    color:#c0392b;
    font-size:13px;
    margin-top:4px;
    margin-bottom:10px;
}

.actions{
    display:flex;
    gap:8px;
}

.btn{
    flex:1;
    height:40px;
    border:none;
    border-radius:8px;
    color:white;
    font-weight:bold;
}

.speak{
    background:#27ae60;
}

.stop{
    background:#e74c3c;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="title">
🧭 Japan AI Guide
</div>

<div class="subtitle">
GPS定位 → 附近景点 → Wikipedia讲解
</div>

<select
id="langSelect"
class="lang">

<option value="zh">🇨🇳 中文</option>
<option value="ja">🇯🇵 日本語</option>
<option value="en">🇺🇸 English</option>

</select>

<button
class="refresh"
onclick="loadNearbySpots()">

📍 获取附近500米景点

</button>

<div
id="status"
class="status">

等待定位...

</div>

</div>

<div id="spotList"></div>

</div>

<script>

let currentSpeech = null;

function stopSpeak(){

    speechSynthesis.cancel();

    currentSpeech = null;

}

function getSpeechLang(){

    const lang =
    document
    .getElementById("langSelect")
    .value;

    if(lang==="ja"){
        return "ja-JP";
    }

    if(lang==="en"){
        return "en-US";
    }

    return "zh-CN";

}

function getWikiApi(){

    const lang =
    document
    .getElementById("langSelect")
    .value;

    if(lang==="ja"){
        return "https://ja.wikipedia.org/api/rest_v1/page/summary/";
    }

    if(lang==="en"){
        return "https://en.wikipedia.org/api/rest_v1/page/summary/";
    }

    return "https://zh.wikipedia.org/api/rest_v1/page/summary/";

}

        getWikiApi() +
        encodeURIComponent(name);
