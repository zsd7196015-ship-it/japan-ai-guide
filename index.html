        function changeLanguage() {
            currentLang = document.getElementById('lang-select').value;
            const t = i18n[currentLang];
            
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('lang-label-text').innerText = t.langLabel;
            document.getElementById('btn-gps').innerText = t.gpsBtn;
            document.getElementById('status').innerText = t.statusInit;

            document.getElementById('opt-recommend').innerText = t.cats.recommend;
            document.getElementById('opt-historic').innerText = t.cats.historic;
            document.getElementById('opt-park').innerText = t.cats.park;
            document.getElementById('opt-museum').innerText = t.cats.museum;

            const welcomeTitleEl = document.getElementById('welcome-title');
            const welcomeDescEl = document.getElementById('welcome-desc');
            if (welcomeTitleEl) welcomeTitleEl.innerText = t.welcomeTitle;
            if (welcomeDescEl) welcomeDescEl.innerText = t.welcomeDesc;

            if (allSpots.length > 0) {
                renderSpots();
            }
        }

        function onCategoryChange() {
            currentCategory = document.getElementById('category-select').value;
            renderSpots();
        }

        function getLocationAndExplore() {
            const t = i18n[currentLang];
            const statusEl = document.getElementById('status');
            
            if (!navigator.geolocation) {
                statusEl.innerText = "Geolocation is not supported";
                return;
            }

            statusEl.innerText = t.statusLocating;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    fetchSpots(currentLat, currentLon);
                },
                (error) => {
                    statusEl.innerText = t.statusErrorGPS;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function fetchSpots(lat, lon) {
            const t = i18n[currentLang];
            const statusEl = document.getElementById('status');
            statusEl.innerText = t.statusLoading;

            const query = `
                [out:json][timeout:25];
                (
                  node(around:1000,${lat},${lon})[historic];
                  way(around:1000,${lat},${lon})[historic];
                  node(around:1000,${lat},${lon})[tourism];
                  way(around:1000,${lat},${lon})[tourism];
                  node(around:1000,${lat},${lon})[leisure=park];
                  way(around:1000,${lat},${lon})[leisure=park];
                  node(around:1000,${lat},${lon})[amenity=place_of_worship];
                  way(around:1000,${lat},${lon})[amenity=place_of_worship];
                );
                out center;
            `;

            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query
                });
                const data = await response.json();
                
                allSpots = data.elements.filter(item => {
                    const tags = item.tags || {};
                    const name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'] || '';
                    
                    if (!name) return false;
                    
                    const blacklist = ['团地', '団地', 'アパート', 'マンション', 'ハイツ', 'コーポ', '住宅', 'parkings', 'school', 'hospital', 'university', 'parking', 'police', 'apartments', 'supermarket'];
                    for (let word of blacklist) {
                        if (name.toLowerCase().includes(word.toLowerCase())) {
                            return false;
                        }
                    }
                    if (tags.residential || tags.landuse === 'residential' || tags.building === 'apartments' || tags.building === 'residential') {
                        return false;
                    }
                    
                    return true;
                });

                statusEl.innerText = t.statusSuccess;
                renderSpots();
            } catch (err) {
                statusEl.innerText = t.statusErrorFetch;
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function isLandmarkSpot(name, tags) {
            const keywords = ['浅草寺', '雷门', '上野恩赐公园', '东京晴空塔', '浅草神社', '西新井大师', '公园', '神社', '寺', '涩谷'];
            for (let kw of keywords) {
                if (name.includes(kw)) return true;
            }
            return !!tags.tourism || !!tags.historic;
        }

                }
            } else if (name.includes("神宫") || name.includes("神社") || name.includes("大师") || name.includes("寺") || name.includes("院")) {
                basicInfo = lang === 'en' ? "A historic religious sanctuary with profound local heritage and traditional wooden architecture." :
                            lang === 'ja' ? "地域に深く根ざした歴史ある社寺で、伝統的な木造建築が魅力です。" :
                            "这是一座历史深厚的宗教地标或古刹，建筑规制完备，完美融合了传统的木构与地方信仰文化。";
                anecdoteInfo = lang === 'en' ? "Legend says sacred springs and divine signs once appeared here during its ancient founding." :
                               lang === 'ja' ? "創建の際には不思議な霊験があったと伝えられています。" :
                               "相传在古代地方建社或建寺之初，曾有高僧显灵与清泉涌出的奇闻在民间流传。";
                photoInfo = lang === 'en' ? "Capture the majestic Torii gate framed by greenery." :
                            lang === 'ja' ? "緑に囲まれた鳥居や手水舎の厳かな雰囲気がおすすめです。" :
                            "鸟居正下方或手水舍侧面特写，极具日式美学。";
                shopInfo = lang === 'en' ? "Look for traditional Omamori (lucky amulets) as souvenirs." :
                           lang === 'ja' ? "社務所のお守りが記念になります。" :
                           "社务所限定的精致“御守”与祈愿“绘马”。";
            } else if (name.includes("公园") || name.includes("庭园")) {
                basicInfo = lang === 'en' ? "An urban green oasis featuring well-landscaped gardens and peaceful walking paths." :
                            lang === 'ja' ? "都会のオアシスとして親しまれる緑豊かな公園です。" :
                            "作为城市中的重要绿地空间，园内水系环绕、古木参天，完美融合了自然生态与人文景观。";
                photoInfo = lang === 'en' ? "Find a scenic spot by the lake bridge during golden hour." :
                           lang === 'ja' ? "夕暮れ時の池にかかる橋が撮影スポットです。" :
                           "湖心桥或林荫小道的斑驳光影处，非常适合拍摄人像。";
            } else {
                basicInfo = lang === 'en' ? "An interesting local spot preserving the unique cultural landscape of this neighborhood." :
                            lang === 'ja' ? "地域の独特な雰囲気を残すローカルスポットです。" :
                            "位于周边的特色人文点位，完整保留了本地区独特的街区风貌与历史印记。";
            }

            return { basic: basicInfo, anecdote: anecdoteInfo, photo: photoInfo, shop: shopInfo };
        }

        function toggleAudio(buttonElement, titleText, basicText, anecdoteText, photoText, shopText, isNearby) {
            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音播报功能');
                return;
            }

            const t = i18n[currentLang];

            if (window.speechSynthesis.speaking && activeSpeechButton === buttonElement) {
                window.speechSynthesis.cancel();
                resetAudioButton(buttonElement);
                return;
            }

            window.speechSynthesis.cancel();
            if (activeSpeechButton) {
                resetAudioButton(activeSpeechButton);
            }

            // 如果距离大于 20 米，语音只播报梗概，提示用户走近可听详细秘闻
            let textToSpeak = currentLang === 'en' ? `${titleText}. Overview: ${basicText}` : 
                                    currentLang === 'ja' ? `${titleText}。概要：${basicText}` : 
                                    `${titleText}。简介：${basicText}`;
            
            if (isNearby) {
                // 20米以内：解锁全部秘闻、拍照、伴手礼
                if (anecdoteText) {
                    textToSpeak += currentLang === 'en' ? ` Anecdote: ${anecdoteText}` : 
                                   currentLang === 'ja' ? ` 逸話：${anecdoteText}` : 
                                   ` 趣闻典故：${anecdoteText}`;
                }
                if (photoText) {
                    textToSpeak += currentLang === 'en' ? ` Best photo spot: ${photoText}` : 
                                   currentLang === 'ja' ? ` 撮影スポット：${photoText}` : 
                                   ` 拍照机位建议：${photoText}`;
                }
                if (shopText) {
                    textToSpeak += currentLang === 'en' ? ` Recommended shops: ${shopText}` : 
                                   currentLang === 'ja' ? ` おすすめのお土産：${shopText}` : 
                                   ` 伴手礼与老店推荐：${shopText}`;
                }
            } else {
                // 20米以外：提示用户
                textToSpeak += currentLang === 'en' ? `. You are more than 20 meters away. Walk closer to unlock full secret stories.` : 
                               currentLang === 'ja' ? `。現在20m以上離れています。近づくと詳細な秘密の解説が流れます。` : 
                               `。您当前距离该景点超过 20 米，走近后将自动解锁深度秘闻讲解。`;
            }

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = t.speechLang; 
            utterance.rate = 0.95; 

            activeSpeechButton = buttonElement;
            buttonElement.innerText = t.stopBtn;
            buttonElement.classList.add('playing');

            utterance.onend = () => resetAudioButton(buttonElement);
            utterance.onerror = () => resetAudioButton(buttonElement);

            window.speechSynthesis.speak(utterance);
        }

        function resetAudioButton(btn) {
            if (!btn) return;
            const t = i18n[currentLang];
            btn.innerText = t.audioBtn;
            btn.classList.remove('playing');
            if (activeSpeechButton === btn) {
                activeSpeechButton = null;
            }
        }

        function renderSpots() {
            const container = document.getElementById('spots-container');
            container.innerHTML = '';
            const t = i18n[currentLang];

            let filteredSpots = allSpots.filter(spot => {
                const tags = spot.tags || {};
                let name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'] || '';
                
                let spotType = 'other';
                if (tags.leisure === 'park') spotType = 'park';
                else if (tags.historic) spotType = 'historic';
                else if (tags.tourism === 'museum') spotType = 'museum';

                if (currentCategory === 'recommend') {
                    return isLandmarkSpot(name, tags);
                }
                return spotType === currentCategory;
            });

            if (currentLat !== null && currentLon !== null) {
                filteredSpots.sort((a, b) => {
                    const latA = a.lat || (a.center && a.center.lat);
                    const lonA = a.lon || (a.center && a.center.lon);
                    const latB = b.lat || (b.center && b.center.lat);
                    const lonB = b.lon || (b.center && b.center.lon);

                    const distA = (latA && lonA) ? calculateDistance(currentLat, currentLon, latA, lonA) : 999999;
                    const distB = (latB && lonB) ? calculateDistance(currentLat, currentLon, latB, lonB) : 999999;
                    return distA - distB;
                });
            }

            if (filteredSpots.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-secondary); background: white; border-radius: var(--border-radius); box-shadow: 0 2px 8px rgba(0,0,0,0.04);">${t.noSpots}</div>`;
                return;
            }

            filteredSpots.forEach(spot => {
                const tags = spot.tags || {};
                
                let name = tags.name || tags['name:ja'] || tags['name:zh'] || 'Location';
                if (currentLang === 'en') {
                    name = tags['name:en'] || tags.name || tags['name:ja'] || 'Location';
                } else if (currentLang === 'ja') {
                    name = tags['name:ja'] || tags.name || 'スポット';
                } else {
                    name = tags['name:zh'] || tags.name || tags['name:ja'] || '景点';
                }
                
                const spotLat = spot.lat || (spot.center && spot.center.lat);
                const spotLon = spot.lon || (spot.center && spot.center.lon);

                let distanceVal = 999; // 默认较远
                let distanceText = t.distanceWalk;
                if (currentLat !== null && currentLon !== null && spotLat && spotLon) {
                    distanceVal = calculateDistance(currentLat, currentLon, spotLat, spotLon);
                    if (distanceVal > 0) {
                        distanceText = `${t.distancePrefix} ${distanceVal} 米`;
                        if (currentLang === 'en') distanceText = `Distance: approx. ${distanceVal}m`;
                        if (currentLang === 'ja') distanceText = `距離：約 ${distanceVal}m`;
                    }
                }

                const mapUrl = (spotLat && spotLon) ? `https://www.google.com/maps/search/?api=1&query=${spotLat},${spotLon}` : '#';
                
                const isLandmark = isLandmarkSpot(name, tags);
                const guideData = generateAIGuideContent(name, tags, currentLang);

                // 核心判定：是否在 20 米以内
                const isNearby = (distanceVal <= 20);

                const card = document.createElement('div');
                card.className = isLandmark ? 'spot-card landmark' : 'spot-card';
                
                let cardHtml = `
                    <div class="spot-title">${name}</div>
                    <div class="spot-meta">${distanceText}</div>
                    <div class="spot-desc-section">${t.labelOverview} ${guideData.basic}</div>
                `;

                if (isNearby) {
                    // 20米以内：展示全部深度秘闻、拍照、伴手礼
                    if (guideData.anecdote) {
                        cardHtml += `<div class="spot-anecdote-section">${t.labelAnecdote} ${guideData.anecdote}</div>`;
                    }
                    if (guideData.photo) {
                        cardHtml += `<div class="spot-photo-section">${t.labelPhoto} ${guideData.photo}</div>`;
                    }
                    if (guideData.shop) {
                        cardHtml += `<div class="spot-shop-section">${t.labelShop} ${guideData.shop}</div>`;
                    }
                } else {
                    // 20米以外：提示用户走近解锁
                    cardHtml += `<div class="proximity-notice">${t.nearbyNotice}</div>`;
                }

                cardHtml += `
                    <div class="spot-actions">
                        <button class="action-btn audio" onclick="toggleAudio(this, '${name.replace(/'/g, "\\'")}', '${guideData.basic.replace(/'/g, "\\'")}', '${(guideData.anecdote || '').replace(/'/g, "\\'")}', '${(guideData.photo || '').replace(/'/g, "\\'")}', '${(guideData.shop || '').replace(/'/g, "\\'")}', ${isNearby})">${t.audioBtn}</button>
                        <a class="action-btn map" href="${mapUrl}" target="_blank">${t.mapBtn}</a>
                    </div>
                `;

                card.innerHTML = cardHtml;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
