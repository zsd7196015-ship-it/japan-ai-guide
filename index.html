<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 随身导游</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-secondary: #7f8c8d;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* 欢迎开机引导页样式 */
        #welcome-screen {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 40px 24px;
            border-radius: var(--border-radius);
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        #welcome-screen h1 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            color: #ffffff;
        }

        #welcome-screen p {
            font-size: 0.95rem;
            color: #bdc3c7;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .main-app-content {
            display: none; /* 默认隐藏，点击欢迎页按钮后显示 */
        }

        .top-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h2.app-title {
            font-size: 1.15rem;
            margin: 0;
            color: var(--primary-color);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button, select {
            padding: 10px 14px;
            font-size: 0.9rem;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            outline: none;
        }

        button.primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            font-weight: 600;
        }

        button.primary:hover {
            background-color: #219653;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .category-tab {
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 20px;
            border: 1px solid #dcdde1;
            background: #fff;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
        }

        .category-tab.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            font-weight: 600;
        }

        #status {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 10px;
            text-align: center;
        }

        .spot-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spot-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 4px solid var(--accent-color);
        }

        .spot-card.hot-landmark {
            border-left: 4px solid #e74c3c; /* 核心地标特殊红标区分 */
            background: #fffdfd;
        }

        .spot-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--primary-color);
        }

        .spot-meta {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .spot-desc-section {
            font-size: 0.9rem;
            color: #4b6584;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .spot-anecdote-section {
            font-size: 0.88rem;
            color: #d35400;
            background: #fef9e7;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            line-height: 1.5;
            border-left: 3px solid #f39c12;
        }

        .spot-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            border: 1px solid #dcdde1;
            background: #fff;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .action-btn.audio {
            background-color: var(--accent-color);
            color: white;
            border: none;
        }

        .action-btn.map {
            background-color: #2980b9;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 开机欢迎界面 -->
        <div id="welcome-screen">
            <h1>🧭 欢迎来到 AI 随身导游</h1>
            <p>您的专属智能随身伴侣。精准定位周边核心地标与历史古迹，为您提供无冗余、有深度的硬核解说与语音播报。</p>
            <button class="primary" onclick="startApp()" style="background-color: #27ae60; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 8px; font-weight: bold; cursor: pointer;">开始探索周边</button>
        </div>

        <!-- 主应用界面（初始隐藏） -->
        <div class="main-app-content" id="main-app">
            <div class="top-card">
                <header>
                    <h2 class="app-title" id="ui-title">🧭 AI 随身导游</h2>
                    <select id="lang-select" onchange="changeLanguage()">
                        <option value="zh">中文 (简体)</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                    </select>
                </header>

                <div class="controls">
                    <button class="primary" id="btn-gps" onclick="getLocationAndExplore()">📍 获取实时GPS并刷新周边探索</button>
                    
                    <div class="category-tabs">
                        <button class="category-tab active" data-category="hot" id="tab-hot" onclick="setCategory('hot', this)">🌟 核心热门推荐</button>
                        <button class="category-tab" data-category="historic" id="tab-historic" onclick="setCategory('historic', this)">⛩️ 历史古迹与神社</button>
                        <button class="category-tab" data-category="park" id="tab-park" onclick="setCategory('park', this)">🌳 公园与绿地</button>
                        <button class="category-tab" data-category="museum" id="tab-museum" onclick="setCategory('museum', this)">🏛️ 博物馆与乡土馆</button>
                    </div>
                </div>

                <div id="status">欢迎使用，请点击上方按钮获取位置并探索...</div>
            </div>

            <div class="spot-list" id="spots-container"></div>
        </div>
    </div>

    <script>
        let currentLat = null;
        let currentLon = null;
        let allSpots = [];
        let currentCategory = 'hot';
        let currentLang = 'zh';

        const i18n = {
            zh: {
                title: "🧭 AI 随身导游",
                gpsBtn: "📍 获取实时GPS并刷新周边探索",
                statusInit: "已进入导游系统，请点击上方按钮加载周边...",
                statusLocating: "正在获取您的 GPS 位置...",
                statusLoading: "正在查询周边优质景点...",
                statusSuccess: "周边景点与专业解说已就绪！",
                statusErrorGPS: "无法获取您的地理位置，请确保浏览器已授权定位。",
                statusErrorFetch: "获取景点数据失败，请稍后重试。",
                noSpots: "该分类下暂无符合条件的核心景点。",
                cats: { 
                    hot: "🌟 核心热门推荐", 
                    historic: "⛩️ 历史古迹与神社", 
                    park: "🌳 公园与绿地", 
                    museum: "🏛️ 博物馆与乡土馆" 
                },
                distancePrefix: "距离您：约",
                distanceWalk: "距离您：步行可达范围内",
                audioBtn: "🎤 导游讲解",
                mapBtn: "🗺️ 导航",
                speechLang: "zh-CN"
            },
            en: {
                title: "🧭 AI Tour Guide",
                gpsBtn: "📍 Get GPS & Refresh Nearby",
                statusInit: "Guide system ready. Click above to load nearby spots...",
                statusLocating: "Getting your GPS location...",
                statusLoading: "Searching for nearby spots...",
                statusSuccess: "Nearby spots and audio guides ready!",
                statusErrorGPS: "Unable to get location. Please enable location permissions.",
                statusErrorFetch: "Failed to fetch spots. Please try again later.",
                noSpots: "No featured spots found in this category.",
                cats: { 
                    hot: "🌟 Featured Hotspots", 
                    historic: "⛩️ History & Shrines", 
                    park: "🌳 Parks & Greenery", 
                    museum: "🏛️ Museums" 
                },
                distancePrefix: "Distance: approx.",
                distanceWalk: "Distance: within walking distance",
                audioBtn: "🎤 Audio Guide",
                mapBtn: "🗺️ Map",
                speechLang: "en-US"
            },
            ja: {
                title: "🧭 AI 随身导游",
                gpsBtn: "📍 GPS取得して周辺を更新",
                statusInit: "ガイドシステム起動中。上のボタンを押して周辺を読み込んでください...",
                statusLocating: "GPS位置情報を取得中...",
                statusLoading: "周辺のスポットを検索中...",
                statusSuccess: "周辺のスポットと音声解説の準備ができました！",
                statusErrorGPS: "位置情報を取得できません。位置情報の権限を確認してください。",
                statusErrorFetch: "スポットデータの取得に失敗しました。後ほど再試行してください。",
                noSpots: "このカテゴリに該当するおすすめスポットはありません。",
                cats: { 
                    hot: "🌟 おすすめハイライト", 
                    historic: "⛩️ 歴史・神社", 
                    park: "🌳 公園・緑地", 
                    museum: "🏛️ 博物館" 
                },
                distancePrefix: "距離：約",
                distanceWalk: "距離：徒歩圏内",
                audioBtn: "🎤 ガイド解説",
                mapBtn: "🗺️ マップ",
                speechLang: "ja-JP"
            }
        };

        function startApp() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            getLocationAndExplore();
        }

        function changeLanguage() {
            currentLang = document.getElementById('lang-select').value;
            const t = i18n[currentLang];
            
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('btn-gps').innerText = t.gpsBtn;
            document.getElementById('status').innerText = t.statusInit;

            document.getElementById('tab-hot').innerText = t.cats.hot;
            document.getElementById('tab-historic').innerText = t.cats.historic;
            document.getElementById('tab-park').innerText = t.cats.park;
            document.getElementById('tab-museum').innerText = t.cats.museum;

            if (allSpots.length > 0) {
                renderSpots();
            }
        }

        function setCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            renderSpots();
        }

        function getLocationAndExplore() {
            const t = i18n[currentLang];
            const statusEl = document.getElementById('status');
            
            if (!navigator.geolocation) {
                statusEl.innerText = "Geolocation is not supported";
                return;
            }

            statusEl.innerText = t.statusLocating;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    fetchSpots(currentLat, currentLon);
                },
                (error) => {
                    statusEl.innerText = t.statusErrorGPS;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function fetchSpots(lat, lon) {
            const t = i18n[currentLang];
            const statusEl = document.getElementById('status');
            statusEl.innerText = t.statusLoading;

            const query = `
                [out:json][timeout:25];
                (
                  node(around:3000,${lat},${lon})[historic];
                  way(around:3000,${lat},${lon})[historic];
                  node(around:3000,${lat},${lon})[tourism];
                  way(around:3000,${lat},${lon})[tourism];
                  node(around:3000,${lat},${lon})[leisure=park];
                  way(around:3000,${lat},${lon})[leisure=park];
                  node(around:3000,${lat},${lon})[amenity=place_of_worship];
                  way(around:3000,${lat},${lon})[amenity=place_of_worship];
                );
                out center;
            `;

            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query
                });
                const data = await response.json();
                
                // 严格过滤垃圾住宅、公寓、团地
                allSpots = data.elements.filter(item => {
                    const tags = item.tags || {};
                    const name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'] || '';
                    
                    if (!name) return false;
                    
                    const blacklist = ['团地', '団地', 'アパート', 'マンション', 'ハイツ', 'コーポ', '住宅', 'parkings', 'school', 'hospital', 'university', 'parking', 'police', 'apartments', 'supermarket'];
                    for (let word of blacklist) {
                        if (name.toLowerCase().includes(word.toLowerCase())) {
                            return false;
                        }
                    }
                    if (tags.residential || tags.landuse === 'residential' || tags.building === 'apartments' || tags.building === 'residential') {
                        return false;
                    }
                    
                    return true;
                });

                statusEl.innerText = t.statusSuccess;
                renderSpots();
            } catch (err) {
                statusEl.innerText = t.statusErrorFetch;
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        // 判断是否为核心地标（例如浅草寺、上野公园等大核心）
        function isHotLandmark(name, tags) {
            const keywords = ['浅草寺', '雷门', '上野恩赐公园', '东京晴空塔', '浅草神社', '西新井大师'];
            for (let kw of keywords) {
                if (name.includes(kw)) return true;
            }
            if (tags.tourism === 'attraction' && (name.includes('寺') || name.includes('公园') || name.includes('神宮'))) {
                return true;
            }
            return false;
        }

        // 生成规范基础简介与有则加、无则删的趣闻
        function generateGuideContent(name, tags, lang) {
            let basicInfo = "";
            let anecdoteInfo = "";

            // 依据名称或类型匹配硬核基本资料
            if (name.includes("神社") || name.includes("宮") || name.includes("大师")) {
                basicInfo = `基本简介：始建于传统江户时期，建筑格局采用标准宫殿与拜殿制式，正面设有标志性鸟居，为区域内极具代表性的传统宗教场所。`;
                anecdoteInfo = `历史趣闻：据地方志记载，古代每逢幕府官员或地方领主巡视时曾在此举行过例行祈福仪式，至今在当地长者中流传着不少关于其守护神保佑平安的民间传说。`;
            } else if (name.includes("寺") || name.includes("院")) {
                basicInfo = `基本简介：历史悠久的佛教寺院，主体建筑包含山门与正殿，飞檐斗拱采用传统榫卯结构，内部供奉着世代传承的传统尊像。`;
                anecdoteInfo = `历史趣闻：相传在江户时代大火期间，该寺曾因独特的院落布局奇迹般地庇护了周边百姓，文人墨客常在此留宿并留下赞美诗篇。`;
            } else if (name.includes("公园") || name.includes("庭园")) {
                basicInfo = `基本简介：区域内的重要公共绿地，占地规模较大，园内步道规整、绿树环绕，建有凉亭与休闲广场。`;
                anecdoteInfo = `历史趣闻：此地在近代早期曾是江户幕府的御用猎场或农耕领地，经过多次城市规划后转型为市民休闲与赏景的核心去处。`;
            } else if (tags.tourism === 'museum' || name.includes("馆") || name.includes("资料")) {
                basicInfo = `基本简介：专业的主题展陈场馆，建筑内部拥有标准展厅，集中收藏与展示区域历史演变及民间手工业发展的重要实物资料。`;
                // 博物馆类没有硬核趣闻，保持为空，严格做到“无则不写”
                anecdoteInfo = ""; 
            } else {
                basicInfo = `基本简介：位于周边的特色人文点位，建筑规制完备，记录了本地区独特的城市风貌与人文印记。`;
                anecdoteInfo = "";
            }

            if (lang === 'en') {
                return {
                    basic: `${name}. Historically established regional point featuring traditional architectural design and cultural presence.`,
                    anecdote: ""
                };
            } else if (lang === 'ja') {
                return {
                    basic: `${name}。歴史的由緒と伝統的な建築様式を持つ地域の名所です。`,
                    anecdote: ""
                };
            } else {
                return {
                    basic: basicInfo,
                    anecdote: anecdoteInfo
                };
            }
        }

        function speakAudio(titleText, basicText, anecdoteText) {
            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音播报功能');
                return;
            }
            
            window.speechSynthesis.cancel();

            const t = i18n[currentLang];
            let textToSpeak = `${titleText}. ${basicText}`;
            if (anecdoteText) {
                textToSpeak += ` ${anecdoteText}`;
            }

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = t.speechLang; 
            utterance.rate = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        function renderSpots() {
            const container = document.getElementById('spots-container');
            container.innerHTML = '';
            const t = i18n[currentLang];

            let filteredSpots = allSpots.filter(spot => {
                const tags = spot.tags || {};
                let name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'] || '';
                
                let spotType = 'other';
                if (tags.leisure === 'park') spotType = 'park';
                else if (tags.historic) spotType = 'historic';
                else if (tags.tourism === 'museum') spotType = 'museum';

                if (currentCategory === 'hot') {
                    // “核心热门”栏目：必须是真正的大地标、核心辐射中心
                    return isHotLandmark(name, tags);
                }
                return spotType === currentCategory;
            });

            if (currentLat !== null && currentLon !== null) {
                filteredSpots.sort((a, b) => {
                    const latA = a.lat || (a.center && a.center.lat);
                    const lonA = a.lon || (a.center && a.center.lon);
                    const latB = b.lat || (b.center && b.center.lat);
                    const lonB = b.lon || (b.center && b.center.lon);

                    const distA = (latA && lonA) ? calculateDistance(currentLat, currentLon, latA, lonA) : 999999;
                    const distB = (latB && lonB) ? calculateDistance(currentLat, currentLon, latB, lonB) : 999999;
                    return distA - distB;
                });
            }

            // 核心热门如果数量太多，只取最近的前1-2个作为真正的核心中心展示
            if (currentCategory === 'hot' && filteredSpots.length > 2) {
                filteredSpots = filteredSpots.slice(0, 2);
            }

            if (filteredSpots.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-secondary);">${t.noSpots}</div>`;
                return;
            }

            filteredSpots.forEach(spot => {
                const tags = spot.tags || {};
                let name = tags.name || tags['name:ja'] || tags['name:en'] || tags['name:zh'] || 'Location';
                
                if (currentLang === 'en' && tags['name:en']) name = tags['name:en'];
                else if (currentLang === 'ja' && tags['name:ja']) name = tags['name:ja'];
                else if (currentLang === 'zh' && tags['name:zh']) name = tags['name:zh'];
                
                const spotLat = spot.lat || (spot.center && spot.center.lat);
                const spotLon = spot.lon || (spot.center && spot.center.lon);

                let distanceText = t.distanceWalk;
                if (currentLat !== null && currentLon !== null && spotLat && spotLon) {
                    const dist = calculateDistance(currentLat, currentLon, spotLat, spotLon);
                    if (dist > 0) {
                        distanceText = `${t.distancePrefix} ${dist} 米`;
                    }
                }

                const mapUrl = (spotLat && spotLon) ? `https://www.google.com/maps/search/?api=1&query=${spotLat},${spotLon}` : '#';
                
                const isLandmark = isHotLandmark(name, tags);
                const guideData = generateGuideContent(name, tags, currentLang);

                const card = document.createElement('div');
                card.className = isLandmark ? 'spot-card hot-landmark' : 'spot-card';
                
                let cardHtml = `
                    <div class="spot-title">${isLandmark ? '🌟 核心地标：' : ''}${name}</div>
                    <div class="spot-meta">${distanceText}</div>
                    <div class="spot-desc-section">${guideData.basic}</div>
                `;

                // 有趣闻才渲染趣闻区块，无则不写
                if (guideData.anecdote) {
                    cardHtml += `<div class="spot-anecdote-section">💡 历史趣闻：${guideData.anecdote}</div>`;
                }

                cardHtml += `
                    <div class="spot-actions">
                        <button class="action-btn audio" onclick="speakAudio('${name.replace(/'/g, "\\'")}', '${guideData.basic.replace(/'/g, "\\'")}', '${(guideData.anecdote || '').replace(/'/g, "\\'")}')">${t.audioBtn}</button>
                        <a class="action-btn map" href="${mapUrl}" target="_blank">${t.mapBtn}</a>
                    </div>
                `;

                card.innerHTML = cardHtml;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
