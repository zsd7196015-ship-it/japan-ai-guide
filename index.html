<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 随身导游</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-secondary: #7f8c8d;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button, select {
            padding: 10px 16px;
            font-size: 0.95rem;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.primary {
            background-color: #27ae60;
            color: white;
            border: none;
            flex: 1;
            font-weight: 600;
        }

        button.primary:hover {
            background-color: #219653;
        }

        select {
            background-color: #fff;
        }

        #status {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-align: center;
        }

        .spot-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spot-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 4px solid #27ae60;
        }

        .spot-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--primary-color);
        }

        .spot-meta {
            font-size: 0.85rem;
            color: #27ae60;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .spot-desc {
            font-size: 0.9rem;
            color: #4b6584;
            margin-bottom: 6px;
            line-height: 1.5;
        }

        .spot-subdesc {
            font-size: 0.85rem;
            color: #a5b1c2;
            margin-bottom: 12px;
        }

        .spot-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            border: 1px solid #dcdde1;
            background: #fff;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .action-btn.audio {
            background-color: #27ae60;
            color: white;
            border: none;
        }

        .action-btn.map {
            background-color: #2980b9;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="ui-title">🧭 AI 随身导游</h1>
            <select id="lang-select">
                <option value="zh">中文 (简体)</option>
            </select>
        </header>

        <div class="controls">
            <button class="primary" id="btn-gps" onclick="getLocationAndSearch()">📍 获取实时GPS并探索周边景点</button>
        </div>

        <div id="status">请点击上方按钮获取位置并加载周边景点...</div>
        <div class="spot-list" id="spots-container"></div>
    </div>

    <script>
        let currentLat = null;
        let currentLon = null;
        let allSpots = [];

        function getLocationAndSearch() {
            const statusEl = document.getElementById('status');
            
            if (!navigator.geolocation) {
                statusEl.innerText = "您的浏览器不支持地理定位";
                return;
            }

            statusEl.innerText = "正在获取您的 GPS 位置...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    fetchSpots(currentLat, currentLon);
                },
                (error) => {
                    statusEl.innerText = "无法获取您的地理位置，请确保浏览器已授权定位。";
                    console.error(error);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function fetchSpots(lat, lon) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "正在查询周边优质景点...";

            const query = `
                [out:json][timeout:25];
                (
                  node(around:1500,${lat},${lon})[historic];
                  way(around:1500,${lat},${lon})[historic];
                  node(around:1500,${lat},${lon})[tourism];
                  way(around:1500,${lat},${lon})[tourism];
                  node(around:1500,${lat},${lon})[leisure=park];
                  way(around:1500,${lat},${lon})[leisure=park];
                );
                out center;
            `;

            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query
                });
                const data = await response.json();
                
                allSpots = data.elements.filter(item => {
                    const tags = item.tags || {};
                    const name = tags.name || tags['name:en'] || tags['name:ja'] || tags['name:zh'];
                    if (!name) return false;

                    const amenity = tags.amenity;
                    const office = tags.office;
                    if (['school', 'university', 'kindergarten', 'hospital', 'parking', 'townhall', 'police', 'fire_station'].includes(amenity)) {
                        return false;
                    }
                    if (office) return false;

                    return true;
                });

                statusEl.innerText = "周边地标与历史文化解说已加载成功！";
                renderSpots();
            } catch (err) {
                statusEl.innerText = "获取景点数据失败，请稍后重试。";
                console.error(err);
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return Math.round(R * c);
        }

        function renderSpots() {
            const container = document.getElementById('spots-container');
            container.innerHTML = '';

            if (allSpots.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-secondary);">附近暂无符合条件的景点。</div>`;
                return;
            }

            allSpots.forEach(spot => {
                const tags = spot.tags || {};
                const name = tags.name || tags['name:en'] || tags['name:ja'] || tags['name:zh'] || '未知地点';
                
                const spotLat = spot.lat || (spot.center && spot.center.lat);
                const spotLon = spot.lon || (spot.center && spot.center.lon);

                // 默认文案
                let distanceText = "距离您：步行可达范围内";
                if (currentLat !== null && currentLon !== null && spotLat && spotLon) {
                    const dist = calculateDistance(currentLat, currentLon, spotLat, spotLon);
                    // 严格保持：只有当距离大于 0 时才显示具体距离米数，绝不显示 0 米
                    if (dist > 0) {
                        distanceText = `距离您：约 ${dist} 米`;
                    }
                }

                const mapUrl = (spotLat && spotLon) ? `https://www.google.com/maps/search/?api=1&query=${spotLat},${spotLon}` : '#';

                const card = document.createElement('div');
                card.className = 'spot-card';
                card.innerHTML = `
                    <div class="spot-title">${name}</div>
                    <div class="spot-meta">${distanceText}</div>
                    <div class="spot-desc">历史与建筑解说：「${name}」是位于该区域内极具地方特色的重要人文地标。该建筑在布局上契合周边街区风貌，不仅在日常生活中发挥着重要功能，也见证了该片区多年来的城市发展与变迁。</div>
                    <div class="spot-subdesc">参观导览：非常适合作为实地步行探索途中的特色坐标，细致观察其周边的街景与建筑特色。</div>
                    <div class="spot-actions">
                        <button class="action-btn audio" onclick="alert('正在生成 ${name} 的语音解说...')">🎤 语音讲解</button>
                        <a class="action-btn map" href="${mapUrl}" target="_blank">🗺️ 导航</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
